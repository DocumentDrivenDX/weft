[package]
name = "weft-postgresql"
version.workspace = true
edition.workspace = true
publish.workspace = true
[dependencies]
weft-core = { path = "../weft-core" }
serde_json.workspace = true
serde.workspace = true
base64 = "=0.22.1"
jsonschema = { version = "=0.56.0", default-features = false, features = ["macros", "arbitrary-precision"] }
[[test]]
name = "candidate-binding"
path = "../../tests/truss-postgresql/binding.rs"
[[test]]
name = "candidate-compiler"
path = "../../tests/truss-postgresql/compiler.rs"

[features]
current-query-refinement-candidate=["weft-core/current-query-refinement-candidate"]
conformance-original=[]

[[test]]
name="mutation_lowering"
path="../../tests/mutation/lowering.rs"
required-features=["conformance-original"]

[[test]]
name="truss-query-abi"
path="../../tests/truss-query-abi/compiler.rs"
