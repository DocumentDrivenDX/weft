[package]
license = "MIT OR Apache-2.0"
name = "weft-model"
# Published to crates.io at the weft release version. See README.md.
version.workspace = true
edition.workspace = true
publish = ["crates-io"]
repository.workspace = true
readme = "README.md"
rust-version = "1.90"
description = "UMF model loading, identity resolution, logical typing and exact values shared by weft and other compilers"

[dependencies]
base64 = "=0.22.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
num-bigint = "=0.4.8"
jsonschema = { version = "=0.56.0", default-features = false, features = ["macros", "arbitrary-precision"] }
