[package]
name="weft-runtime"
default-run="weft-runtime"
version.workspace=true
edition.workspace=true
publish.workspace=true
[features]
ashlar-sdk-ordered-page-candidate=["raw-postgresql-reads","dep:weft-databricks","weft-databricks/sdk-ordered-page-candidate","weft-core/engine-ordered-page-candidate"]
managed-delta-mutation-candidate=["dep:weft-databricks"]
current-presence-graph-requirements-candidate=["current-presence-model-requirements-candidate","weft-core/current-presence-graph-requirements-candidate"]
current-presence-model-requirements-candidate=["current-presence-candidate","weft-core/current-presence-model-requirements-candidate"]
current-presence-candidate=["application-lineage-candidate","dep:weft-postgresql","weft-core/current-presence-context-candidate","weft-postgresql/current-presence-candidate"]
raw-postgresql-reads=["dep:weft-postgresql","dep:weft-databricks"]
current-spark-scalar-candidate=["application-lineage-candidate","dep:weft-databricks","weft-databricks/current-spark-scalar-candidate"]

bounded-current-string-candidate=["current-query-refinement-candidate","weft-postgresql/bounded-current-string-candidate","weft-databricks/bounded-current-string-candidate"]
current-query-refinement-candidate=["current-postgresql-scalar-candidate","current-databricks-scalar-candidate","weft-postgresql/current-query-refinement-candidate","weft-databricks/current-query-refinement-candidate"]
current-databricks-scalar-candidate=["application-lineage-candidate","dep:weft-databricks"]
truss-browser-local=["dep:weft-postgresql"]
application-lineage-candidate=[]
current-postgresql-scalar-candidate=["application-lineage-candidate","dep:weft-postgresql"]
truss-security-relationship-candidate=["dep:weft-postgresql"]
ashlar-databricks-compatible-revisions-candidate=["dep:weft-databricks"]
truss-postgresql-pg18=["dep:weft-postgresql"]
ashlar-databricks-implicit-arithmetic=["dep:weft-databricks"]
ashlar-databricks-paths-keys=["dep:weft-databricks"]
ashlar-databricks-paths=["dep:weft-databricks"]
ashlar-databricks-left-join=["dep:weft-databricks"]
ashlar-databricks-count-distinct=["dep:weft-databricks"]
ashlar-databricks-count-having=["dep:weft-databricks"]
truss-postgresql-qualified=["dep:weft-postgresql"]
ashlar-databricks-qualified=["dep:weft-databricks"]
ashlar-databricks-candidate=["dep:weft-databricks"]
ashlar-databricks-mathematical-integer=["dep:weft-databricks"]
ashlar-databricks-arithmetic=["dep:weft-databricks"]
test-original=["dep:weft-postgresql","weft-postgresql/conformance-original"]
truss-postgresql-candidate=["dep:weft-postgresql"]
test-third=["dep:weft-backend-probe"]
[dependencies]
serde_json.workspace=true
serde.workspace=true
weft-databricks={path="../weft-databricks",optional=true}
weft-core={path="../weft-core"}
weft-backend-probe={path="../../tests/register-backend/probe",optional=true}
weft-postgresql={path="../weft-postgresql",optional=true}

[dev-dependencies]
serde_json.workspace=true
serde.workspace=true

[[bin]]
name="weft-security-mapping"
path="src/security_mapping_cli.rs"

[[example]]
name="compile_native_review"
required-features=["truss-postgresql-candidate","ashlar-databricks-candidate"]

[[example]]
name="compile_qualified"
required-features=["truss-postgresql-candidate","ashlar-databricks-candidate"]

[[bin]]
name="weft-paths"
path="src/paths_cli.rs"
required-features=["ashlar-databricks-paths"]

[[bin]]
name="weft-paths-keys"
path="src/paths_keys_cli.rs"
required-features=["ashlar-databricks-paths-keys"]

[[bin]]
name="weft-implicit-arithmetic"
path="src/implicit_arithmetic_cli.rs"
required-features=["ashlar-databricks-implicit-arithmetic"]

[[example]]
name="compile_truss_query_abi"
required-features=["truss-postgresql-pg18"]
