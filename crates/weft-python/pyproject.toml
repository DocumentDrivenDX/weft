[build-system]
requires=["maturin==1.9.6"]
build-backend="maturin"
[project]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE.md", "LICENSE-MIT", "LICENSE-APACHE", "THIRD-PARTY-LICENSES.txt"]
name="weft-sql"
version = "0.4.48"
description="Native UMF-powered SQL compiler with explicit backend profiles"
readme="README.md"
requires-python=">=3.9"
[project.urls]
Repository="https://github.com/DocumentDrivenDX/weft"
Issues="https://github.com/DocumentDrivenDX/weft/issues"
[tool.maturin]
bindings="pyo3"
features=["raw-postgresql-reads","ashlar-databricks-qualified","truss-postgresql-pg18","current-postgresql-scalar-candidate","current-databricks-scalar-candidate","current-query-refinement-candidate","current-presence-graph-requirements-candidate"]
