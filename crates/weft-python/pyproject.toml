[build-system]
requires=["maturin==1.9.6"]
build-backend="maturin"
[project]
name="weft-sql"
version = "0.4.40"
requires-python=">=3.9"
[tool.maturin]
bindings="pyo3"
features=["raw-postgresql-reads","ashlar-databricks-qualified","truss-postgresql-pg18","current-postgresql-scalar-candidate","current-databricks-scalar-candidate","current-query-refinement-candidate"]
