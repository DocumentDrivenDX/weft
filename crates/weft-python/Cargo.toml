[package]
name="weft-python"
version.workspace=true
edition.workspace=true
publish.workspace=true
[lib]
name="weft"
crate-type=["cdylib"]
[features]
ashlar-databricks-count-distinct=["weft-runtime/ashlar-databricks-count-distinct"]
truss-postgresql-qualified=["weft-runtime/truss-postgresql-qualified"]
ashlar-databricks-qualified=["weft-runtime/ashlar-databricks-qualified"]
ashlar-databricks-candidate=["weft-runtime/ashlar-databricks-candidate"]
ashlar-databricks-arithmetic=["weft-runtime/ashlar-databricks-arithmetic"]
test-original=["weft-runtime/test-original"]
truss-postgresql-candidate=["weft-runtime/truss-postgresql-candidate"]
test-third=["weft-runtime/test-third"]
[dependencies]
weft-runtime={path="../weft-runtime"}
pyo3={version="=0.27.1",features=["extension-module","abi3-py39"]}
