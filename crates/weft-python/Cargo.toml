[package]
name="weft-python"
version = "0.4.53"
edition.workspace=true
publish.workspace=true
license.workspace=true
[lib]
name="weft"
crate-type=["cdylib"]
[features]
ashlar-sdk-ordered-page-candidate=["weft-runtime/ashlar-sdk-ordered-page-candidate"]
managed-delta-mutation-candidate=["weft-runtime/managed-delta-mutation-candidate"]
current-presence-graph-requirements-candidate=["current-presence-model-requirements-candidate","weft-runtime/current-presence-graph-requirements-candidate"]
current-presence-model-requirements-candidate=["current-presence-candidate","weft-runtime/current-presence-model-requirements-candidate"]
current-presence-candidate=["application-lineage-candidate","weft-runtime/current-presence-candidate"]
raw-postgresql-reads=["weft-runtime/raw-postgresql-reads"]
current-spark-scalar-candidate=["current-query-refinement-candidate","weft-runtime/current-spark-scalar-candidate"]

bounded-current-string-candidate=["current-query-refinement-candidate","weft-runtime/bounded-current-string-candidate"]
current-query-refinement-candidate=["current-postgresql-scalar-candidate","current-databricks-scalar-candidate","weft-runtime/current-query-refinement-candidate"]
current-databricks-scalar-candidate=["application-lineage-candidate","weft-runtime/current-databricks-scalar-candidate"]
application-lineage-candidate=["weft-runtime/application-lineage-candidate"]
current-postgresql-scalar-candidate=["application-lineage-candidate","weft-runtime/current-postgresql-scalar-candidate"]
truss-security-relationship-candidate=["weft-runtime/truss-security-relationship-candidate"]
ashlar-databricks-compatible-revisions-candidate=["weft-runtime/ashlar-databricks-compatible-revisions-candidate"]
truss-postgresql-pg18=["weft-runtime/truss-postgresql-pg18"]
ashlar-databricks-implicit-arithmetic=["weft-runtime/ashlar-databricks-implicit-arithmetic"]
ashlar-databricks-paths-keys=["weft-runtime/ashlar-databricks-paths-keys"]
ashlar-databricks-left-join=["weft-runtime/ashlar-databricks-left-join"]
ashlar-databricks-count-distinct=["weft-runtime/ashlar-databricks-count-distinct"]
ashlar-databricks-count-having=["weft-runtime/ashlar-databricks-count-having"]
truss-postgresql-qualified=["weft-runtime/truss-postgresql-qualified"]
ashlar-databricks-qualified=["weft-runtime/ashlar-databricks-qualified"]
ashlar-databricks-candidate=["weft-runtime/ashlar-databricks-candidate"]
ashlar-databricks-arithmetic=["weft-runtime/ashlar-databricks-arithmetic"]
test-original=["weft-runtime/test-original"]
truss-postgresql-candidate=["weft-runtime/truss-postgresql-candidate"]
test-third=["weft-runtime/test-third"]
[dependencies]
weft-runtime={path="../weft-runtime"}
pyo3={version="=0.27.1",features=["extension-module","abi3-py39"]}
