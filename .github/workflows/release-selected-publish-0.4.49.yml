name: Publish selected qualified Weft 0.4.49 assets
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source commit pinned by v0.4.49
        required: true
        type: string
      linux_run_id:
        description: Completed selected Linux artifact-only build run
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: selected-weft-0.4.49-publish
  cancel-in-progress: false
jobs:
  publish-selected-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
      - name: Require matching source and draft tag
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$WORKFLOW_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'refs/tags/v0.4.49^{commit}')" = "$SOURCE_SHA"
          test "$(gh release view v0.4.49 --json isDraft --jq .isDraft)" = true
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.linux_run_id }}
          github-token: ${{ github.token }}
          name: weft-0.4.49-linux-x86_64-${{ inputs.source_sha }}
          path: selected/linux
      - name: Download the exact staged macOS and UC qualification assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p selected/macos selected/proof
          gh release download v0.4.49 --pattern 'weft_sql-0.4.49-*-macosx_*_arm64.whl' --dir selected/macos
          gh release download v0.4.49 --pattern 'selected-macos-build-0.4.49.json' --dir selected/macos
          gh release download v0.4.49 --pattern 'packaging-macos-arm64.json' --dir selected/macos
          gh release download v0.4.49 --pattern 'managed-current-uc-qualification-v0.4.49.json' --dir selected/proof
          gh release download v0.4.49 --pattern 'managed-current-uc-case-backend03-grouped-having-v0.4.49.json' --dir selected/proof
          gh release download v0.4.49 --pattern 'managed-current-uc-case-backend03-negative-having-v0.4.49.json' --dir selected/proof
          gh release download v0.4.49 --pattern 'managed-current-uc-case-backend02-page1-v0.4.49.json' --dir selected/proof
          gh release download v0.4.49 --pattern 'managed-current-uc-case-backend02-continuation-v0.4.49.json' --dir selected/proof
          gh release download v0.4.49 --pattern 'managed-current-uc-program-parity-v0.4.49.json' --dir selected/proof
          gh release download v0.4.49 --pattern 'current-native-query-and-sdk-pages-20261021.json' --dir selected/proof
          gh release download v0.4.49 --pattern 'positive_grouped_graph_query.json.gz' --dir selected/proof
          gh release download v0.4.49 --pattern 'negative_having_query.json.gz' --dir selected/proof
          gh release download v0.4.49 --pattern 'sdk_pages_2_plus_1.json.gz' --dir selected/proof
      - name: Verify selected Linux artifact run identity
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_RUN_ID: ${{ inputs.linux_run_id }}
        run: |
          case "$LINUX_RUN_ID" in ''|*[!0-9]*) exit 1;; esac
          gh run view "$LINUX_RUN_ID" --json workflowName,conclusion,event,headSha > selected/linux-run.json
      - name: Verify exact wheel, RECORD, source and native qualification lineage
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          linux_wheel="$(find selected/linux -maxdepth 1 -name 'weft_sql-0.4.49-*-manylinux_2_17_x86_64.manylinux2014_x86_64.whl' -print -quit)"
          macos_wheel="$(find selected/macos -maxdepth 1 -name 'weft_sql-0.4.49-*-macosx_*_arm64.whl' -print -quit)"
          test "$(find selected/linux -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')" = 1
          test "$(find selected/macos -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')" = 1
          test -n "$linux_wheel" && test -n "$macos_wheel"
          python scripts/release/verify-selected-assets-0.4.49.py \
            --source-commit "$SOURCE_SHA" \
            --linux-run-id "${{ inputs.linux_run_id }}" --linux-run-report selected/linux-run.json \
            --linux-wheel "$linux_wheel" \
            --linux-build-report selected/linux/selected-linux-build-0.4.49.json \
            --linux-packaging-report selected/linux/packaging-linux-x86_64.json \
            --macos-wheel "$macos_wheel" \
            --macos-build-report selected/macos/selected-macos-build-0.4.49.json \
            --macos-packaging-report selected/macos/packaging-macos-arm64.json \
            --managed-qualification selected/proof/managed-current-uc-qualification-v0.4.49.json \
            --backend03-evidence selected/proof/managed-current-uc-case-backend03-grouped-having-v0.4.49.json \
            --backend03-negative-having-evidence selected/proof/managed-current-uc-case-backend03-negative-having-v0.4.49.json \
            --backend02-page1-evidence selected/proof/managed-current-uc-case-backend02-page1-v0.4.49.json \
            --backend02-continuation-evidence selected/proof/managed-current-uc-case-backend02-continuation-v0.4.49.json \
            --program-parity selected/proof/managed-current-uc-program-parity-v0.4.49.json \
            --prior-local-evidence selected/proof/current-native-query-and-sdk-pages-20261021.json \
            --prior-grouped-gzip selected/proof/positive_grouped_graph_query.json.gz \
            --prior-negative-gzip selected/proof/negative_having_query.json.gz \
            --prior-pages-gzip selected/proof/sdk_pages_2_plus_1.json.gz \
            --output selected/release-pins-0.4.49.json
          cp "$linux_wheel" selected/
          cp "$macos_wheel" selected/
          cp selected/linux/packaging-linux-x86_64.json selected/
          (cd selected && sha256sum weft_sql-0.4.49-*-manylinux_2_17_x86_64.manylinux2014_x86_64.whl weft_sql-0.4.49-*-macosx_*_arm64.whl > SHA256SUMS)
      - name: Add selected Linux bytes and promote the qualified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.4.49 \
            selected/weft_sql-0.4.49-*-manylinux_2_17_x86_64.manylinux2014_x86_64.whl \
            selected/packaging-linux-x86_64.json \
            selected/release-pins-0.4.49.json \
            selected/SHA256SUMS
          gh release edit v0.4.49 --draft=false --latest
