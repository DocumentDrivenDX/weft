name: PyPI publisher validation
on:
  pull_request:
    paths: ['scripts/**publish_pypi_release.py', '.github/workflows/*pypi*.yml']
  push:
    paths: ['scripts/**publish_pypi_release.py', '.github/workflows/*pypi*.yml']
permissions:
  contents: read
jobs:
  publisher-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/release/test_publish_pypi_release.py
