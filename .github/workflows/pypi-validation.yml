name: PyPI publisher validation
on:
  pull_request:
    paths:
      - scripts/**publish_pypi_release.py
      - scripts/**publish_hosted_release.py
      - scripts/**verify_hosted_macos_artifact.py
      - scripts/**finalize_hosted_macos.py
      - scripts/**test_publish_hosted_release.py
      - scripts/**test_verify_hosted_macos_artifact.py
      - .github/workflows/*pypi*.yml
      - .github/workflows/release.yml
      - .github/workflows/release-hosted-macos.yml
  push:
    paths:
      - scripts/**publish_pypi_release.py
      - scripts/**publish_hosted_release.py
      - scripts/**verify_hosted_macos_artifact.py
      - scripts/**finalize_hosted_macos.py
      - scripts/**test_publish_hosted_release.py
      - scripts/**test_verify_hosted_macos_artifact.py
      - .github/workflows/*pypi*.yml
      - .github/workflows/release.yml
      - .github/workflows/release-hosted-macos.yml
permissions:
  contents: read
jobs:
  publisher-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python scripts/release/test_publish_pypi_release.py
          python scripts/release/test_publish_hosted_release.py
          python scripts/release/test_verify_hosted_macos_artifact.py
