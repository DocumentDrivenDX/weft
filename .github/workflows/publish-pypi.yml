name: Publish Weft wheels to PyPI
on:
  workflow_run:
    workflows: ["*"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing qualified release tag
        required: true
        type: string
      source_sha:
        description: Exact commit targeted by the immutable release tag
        required: true
        type: string
      expected_sums_sha256:
        description: SHA-256 of the public release SHA256SUMS file
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: pypi-publish-weft-${{ github.event.workflow_run.head_sha || inputs.source_sha || github.run_id }}
  cancel-in-progress: false
jobs:
  verify-release:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.path == '.github/workflows/release.yml' || startsWith(github.event.workflow_run.path, '.github/workflows/release-selected-publish-')) &&
        (startsWith(github.event.workflow_run.head_branch, 'v') || startsWith(github.event.workflow_run.path, '.github/workflows/release-selected-publish-') ||
          (github.event.workflow_run.path == '.github/workflows/release.yml' && github.event.workflow_run.event == 'workflow_dispatch' &&
            github.event.workflow_run.head_branch == github.event.repository.default_branch))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.identity.outputs.version }}
      distribution: ${{ steps.identity.outputs.distribution }}
      wheel_prefix: ${{ steps.identity.outputs.wheel_prefix }}
      eligible: ${{ steps.identity.outputs.eligible }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test the release publisher validator
        run: python scripts/release/test_publish_pypi_release.py
      - name: Read the release job outcome for a main-branch dispatch
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.path == '.github/workflows/release.yml' &&
          github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch
        id: producer-publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          outcomes="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/jobs" --jq '.jobs[] | select(.name == "publish") | .conclusion')"
          [[ "$outcomes" == success || "$outcomes" == skipped ]]
          printf 'conclusion=%s\n' "$outcomes" >> "$GITHUB_OUTPUT"
      - name: Download release intent from a main-branch release dispatch
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.path == '.github/workflows/release.yml' &&
          github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch
        continue-on-error: true
        id: intent
        uses: actions/download-artifact@v4
        with:
          name: weft-pypi-intent-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: incoming/producer-intent
      - name: Bind exact tag, source and optional backfill pins
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRODUCER_PATH: ${{ github.event.workflow_run.path }}
          PRODUCER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PRODUCER_EVENT: ${{ github.event.workflow_run.event }}
          PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
          PRODUCER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PRODUCER_PUBLISH_OUTCOME: ${{ steps.producer-publish.outputs.conclusion }}
          INTENT_DOWNLOAD_OUTCOME: ${{ steps.intent.outcome }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_TAG: ${{ inputs.tag }}
          MANUAL_SUMS_SHA256: ${{ inputs.expected_sums_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            TARGET_TAG="$INPUT_TAG"
            SOURCE_SHA="$INPUT_SOURCE_SHA"
            [[ "$MANUAL_SUMS_SHA256" =~ ^[0-9a-f]{64}$ ]]
            SUMS_SHA256="$MANUAL_SUMS_SHA256"
          elif [[ "$PRODUCER_PATH" == .github/workflows/release.yml &&
                  "$PRODUCER_EVENT" == workflow_dispatch &&
                  "$PRODUCER_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            if [[ ! -f incoming/producer-intent/release-pins.json || ! -f incoming/producer-intent/SHA256SUMS ]]; then
              if [[ "$PRODUCER_PUBLISH_OUTCOME" != skipped ]]; then
                echo 'main-branch release completed its publish job but its pinned intent artifact is missing' >&2
                exit 1
              fi
              echo 'eligible=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$PRODUCER_PUBLISH_OUTCOME" != success || "$INTENT_DOWNLOAD_OUTCOME" != success ]]; then
              echo 'main-branch release intent artifact is inconsistent with the producer publish job' >&2
              exit 1
            fi
            python - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts/release')
          import publish_pypi_release as publisher

          root=Path('incoming/producer-intent')
          pins=json.loads((root/'release-pins.json').read_text(encoding='utf-8'))
          sums=(root/'SHA256SUMS').read_bytes()
          tag = pins.get('tag')
          source = pins.get('commit')
          workflow = pins.get('workflowCommit')
          run_id = pins.get('workflowRunId')
          if not isinstance(tag, str) or re.fullmatch(
              r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag
          ) is None:
              raise SystemExit('producer release intent tag is invalid')
          if not isinstance(source, str) or re.fullmatch(r'[0-9a-f]{40}', source) is None:
              raise SystemExit('producer release intent source is invalid')
          if (
              workflow != os.environ['PRODUCER_HEAD_SHA']
              or type(run_id) is not int
              or str(run_id) != os.environ['PRODUCER_RUN_ID']
          ):
              raise SystemExit('producer release intent run/source binding differs')
          version = tag[1:]
          distribution = publisher.distribution_for_version(version)
          if pins.get('distribution') != distribution:
              raise SystemExit('producer distribution does not match the selected release-name cohort')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(
                  f"tag={tag}\nsource_sha={source}\n"
                  f"sums_sha256={hashlib.sha256(sums).hexdigest()}\n"
                  f"version={version}\ndistribution={distribution}\n"
                  f"wheel_prefix={publisher.wheel_prefix_for_version(version)}\neligible=true\n"
              )
          PYTHON
            exit 0
          else
            if [[ "$PRODUCER_PATH" =~ /release-selected-publish-((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))\.yml$ ]]; then
              TARGET_TAG="v${BASH_REMATCH[1]}"
            else
              TARGET_TAG="$PRODUCER_BRANCH"
            fi
            SUMS_SHA256=""
          fi
          [[ "$TARGET_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          VERSION="${TARGET_TAG#v}"
          read -r DISTRIBUTION WHEEL_PREFIX < <(python - "$VERSION" <<'PYTHON'
          import sys
          sys.path.insert(0,'scripts/release')
          import publish_pypi_release as publisher
          version=sys.argv[1]
          print(publisher.distribution_for_version(version), publisher.wheel_prefix_for_version(version))
          PYTHON
          )
          printf 'tag=%s\nsource_sha=%s\nsums_sha256=%s\nversion=%s\ndistribution=%s\nwheel_prefix=%s\n' \
            "$TARGET_TAG" "$SOURCE_SHA" "$SUMS_SHA256" "$VERSION" "$DISTRIBUTION" "$WHEEL_PREFIX" >> "$GITHUB_OUTPUT"
          echo 'eligible=true' >> "$GITHUB_OUTPUT"
      - name: Read the immutable public release and tag objects
        if: steps.identity.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > incoming/release.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > incoming/tag-ref.json
          if [[ "$(jq -r .object.type incoming/tag-ref.json)" == tag ]]; then
            OBJECT_SHA="$(jq -r .object.sha incoming/tag-ref.json)"
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$OBJECT_SHA" > incoming/tag-object.json
          fi
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID" > incoming/producer-run.json
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir incoming/assets
      - name: Verify tag source, checksum manifest, pins and package metadata
        if: steps.identity.outputs.eligible == 'true'
        id: source
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          VERSION: ${{ steps.identity.outputs.version }}
          EXPECTED_SUMS_SHA256: ${{ steps.identity.outputs.sums_sha256 }}
          DISTRIBUTION: ${{ steps.identity.outputs.distribution }}
          WHEEL_PREFIX: ${{ steps.identity.outputs.wheel_prefix }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$EXPECTED_SUMS_SHA256" ]]; then
            EXPECTED_SUMS_SHA256="$(jq -r '.assets[] | select(.name == "SHA256SUMS") | .digest | sub("^sha256:"; "")' incoming/release.json)"
          fi
          test "${#EXPECTED_SUMS_SHA256}" = 64
          ARGS=(prepare --repository "$GITHUB_REPOSITORY" --tag "$TAG" --source-sha "$SOURCE_SHA"
            --expected-sums-sha256 "$EXPECTED_SUMS_SHA256" --distribution "$DISTRIBUTION"
            --wheel-prefix "$WHEEL_PREFIX" --wheel-count 3
            --release-json incoming/release.json --tag-ref-json incoming/tag-ref.json
            --assets-dir incoming/assets --output-dir dist --receipt dist/source-receipt.json)
          if [[ -f incoming/tag-object.json ]]; then ARGS+=(--tag-object-json incoming/tag-object.json); fi
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            ARGS+=(--producer-run-json incoming/producer-run.json
              --producer-workflow-path .github/workflows/release.yml
              --producer-workflow-prefix .github/workflows/release-selected-publish-
              --default-branch "$DEFAULT_BRANCH")
          fi
          python scripts/release/publish_pypi_release.py "${ARGS[@]}"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'distribution=%s\n' "$DISTRIBUTION" >> "$GITHUB_OUTPUT"
          printf 'wheel_prefix=%s\n' "$WHEEL_PREFIX" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.identity.outputs.eligible == 'true'
        with:
          name: weft-pypi-release-${{ steps.identity.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: verify-release
    if: needs.verify-release.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: weft-pypi-release-${{ needs.verify-release.outputs.version }}
          path: dist
      - name: Refuse PyPI collisions and require exact archive bytes
        id: preflight
        run: python scripts/release/publish_pypi_release.py check-pypi --receipt dist/source-receipt.json --dist-dir dist
      - name: Stage only the verified wheels
        if: steps.preflight.outputs.status == 'absent'
        env:
          WHEEL_PREFIX: ${{ needs.verify-release.outputs.wheel_prefix }}
        run: |
          mkdir .verified-pypi-packages
          cp "dist/$WHEEL_PREFIX"*.whl .verified-pypi-packages/
      - uses: pypa/gh-action-pypi-publish@release/v1
        id: pypi-upload
        if: steps.preflight.outputs.status == 'absent'
        with:
          packages-dir: .verified-pypi-packages/
      - name: Verify PyPI-served bytes after publication
        id: postflight
        run: python scripts/release/publish_pypi_release.py check-pypi --receipt dist/source-receipt.json --dist-dir dist --wait --timeout 300
      - name: Record exact PyPI publication result
        env:
          UPLOAD_OUTCOME: ${{ steps.pypi-upload.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = json.loads(Path("dist/source-receipt.json").read_text(encoding="utf-8"))
          record = {
              "schema": "pypi-publication-receipt.v1",
              "status": "passed",
              "registry": "pypi",
              "tag": source["tag"],
              "source_sha": source["source_sha"],
              "distribution": source["distribution"],
              "version": source["version"],
              "files": source["files"],
              "publication_mode": "oidc_upload" if os.environ["UPLOAD_OUTCOME"] == "success" else "existing_exact_bytes",
              "oidc_trusted_publisher": os.environ["UPLOAD_OUTCOME"] == "success",
              "registry_bytes_verified": True,
          }
          Path("dist/publication-receipt.json").write_text(json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: weft-pypi-publication-${{ needs.verify-release.outputs.version }}
          path: dist/*receipt.json
          if-no-files-found: error
          retention-days: 365

  installed-consumer:
    needs: [verify-release, publish]
    if: needs.verify-release.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the published Weft wheel from PyPI only
        env:
          VERSION: ${{ needs.verify-release.outputs.version }}
          DISTRIBUTION: ${{ needs.verify-release.outputs.distribution }}
          PIP_CONFIG_FILE: /dev/null
          PIP_INDEX_URL: ''
          PIP_EXTRA_INDEX_URL: ''
          PIP_FIND_LINKS: ''
          PIP_NO_INDEX: ''
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pypi-consumer"
          "$RUNNER_TEMP/pypi-consumer/bin/python" -m pip --isolated install \
            --disable-pip-version-check --no-cache-dir --index-url https://pypi.org/simple \
            --report "$RUNNER_TEMP/pip-install-report.json" "$DISTRIBUTION==$VERSION"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pypi-consumer/bin/python" - <<'PY'
          import importlib.metadata, json, os
          from pathlib import Path
          import weft
          report = json.loads(Path(os.environ["RUNNER_TEMP"], "pip-install-report.json").read_text(encoding="utf-8"))
          for item in report["install"]:
              url = item["download_info"]["url"]
              assert url.startswith("https://files.pythonhosted.org/"), url
          record = {
              "schema": "pypi-consumer-receipt.v1",
              "status": "passed",
              "index": "https://pypi.org/simple",
              "weft_distribution": os.environ["DISTRIBUTION"],
              "weft_version": importlib.metadata.version(os.environ["DISTRIBUTION"]),
          }
          assert record["weft_version"] == os.environ["VERSION"]
          Path(os.environ["RUNNER_TEMP"], "consumer-receipt.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print("fresh PyPI Weft consumer imported the compiler")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: weft-pypi-consumer-${{ needs.verify-release.outputs.version }}
          path: ${{ runner.temp }}/consumer-receipt.json
          if-no-files-found: error
          retention-days: 365
