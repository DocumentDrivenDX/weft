name: Release

# Pushing a tag vX.Y.Z tests, builds, smoke-tests and publishes umf-weft.
# A manual run (workflow_dispatch) builds and smoke-tests only; it publishes
# nothing unless it is started on a tag with dry_run set to false.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and smoke-test only; never publish
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MATURIN_VERSION: '1.9.6'
  RUST_TOOLCHAIN: '1.90.0'
  # weft-wasm features that match the Python wheel's [tool.maturin].features.
  WASM_FEATURES: raw-postgresql-reads,truss-postgresql-pg18,ashlar-sdk-ordered-page-candidate,ashlar-databricks-paths-keys,ashlar-databricks-qualified

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: v
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('crates/weft-python/pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag, manifests, UMF pin and changelog agree
        # A manual run on a branch cannot match a tag; it reports but does not block.
        continue-on-error: ${{ github.ref_type != 'tag' }}
        run: python3 scripts/check-release-version.py "${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.v.outputs.version) }}"

  wheels:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: '2014'}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: '2014'}
          # The only non-Linux runner: it builds the macOS arm64 wheel for users.
          - {os: macos-15, target: aarch64-apple-darwin, manylinux: 'off'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --manifest-path crates/weft-python/Cargo.toml --release --locked --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wasm:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.105 --locked
      - name: Build and package the web and nodejs bundles
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cargo build --locked --release -p weft-wasm --target wasm32-unknown-unknown --features "$WASM_FEATURES"
          mkdir -p out
          for target in web nodejs; do
            wasm-bindgen --target "$target" --out-dir "pkg-$target" target/wasm32-unknown-unknown/release/weft_wasm.wasm
            tar -czf "out/weft-wasm-$target-$VERSION.tar.gz" -C "pkg-$target" .
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: out/*.tar.gz
          if-no-files-found: error

  smoke:
    # Install each built wheel into a fresh virtualenv and run the quickstart.
    needs: [version, wheels]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {os: macos-15, target: aarch64-apple-darwin}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist
      - name: Fresh virtualenv, install the wheel, run the quickstart
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-index --find-links dist "umf-weft==$VERSION"
          py="$RUNNER_TEMP/venv/bin/python"
          "$py" -I -c "import weft; assert weft.__version__ == '$VERSION', weft.__version__"
          "$py" -I examples/quickstart.py
          "$py" -I tests/truss-facts/check.py --reports "$RUNNER_TEMP/truss-facts.json"

  publish:
    # PyPI trusted publishing: no token. Needs the owner's trusted-publisher entry
    # for umf-weft (workflow release.yml, environment pypi).
    if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry_run == false) }}
    needs: [ci, version, wheels, sdist, wasm, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{wheel-*,sdist}'
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    needs: [version, publish, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '{wheel-*,sdist,wasm}'
          merge-multiple: true
          path: assets
      - name: Checksums
        working-directory: assets
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            assets/*.whl
            assets/*.tar.gz
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "umf-weft $VERSION" --notes-file notes.md assets/*

  postflight:
    # The published package installs from PyPI into a fresh virtualenv and runs.
    needs: [version, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install from PyPI and run the quickstart
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          for attempt in $(seq 1 10); do
            "$RUNNER_TEMP/venv/bin/pip" install --no-cache-dir "umf-weft==$VERSION" && break
            test "$attempt" -lt 10 && sleep 30
          done
          "$RUNNER_TEMP/venv/bin/python" -I examples/quickstart.py
