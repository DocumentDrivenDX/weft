name: Release Python wheels
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (empty builds only)
        required: false
        default: ''
        type: string
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REQUESTED: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
permissions:
  contents: read
concurrency:
  group: python-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: '2014'}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: '2014'}
          - {os: macos-14, target: aarch64-apple-darwin, manylinux: auto}
          - {os: macos-15-intel, target: x86_64-apple-darwin, manylinux: auto}
          - {os: windows-2022, target: x86_64-pc-windows-msvc, manylinux: auto}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Preserve source bytes and support Windows long paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check distribution and crate version against tag
        shell: bash
        run: |
          python - <<'PYTHON'
          import os,tomllib
          p=tomllib.load(open('crates/weft-python/pyproject.toml','rb'))['project']['version']
          c=tomllib.load(open('crates/weft-python/Cargo.toml','rb'))['package']['version']
          assert p==c
          if os.environ['RELEASE_REQUESTED']=='true':assert os.environ['RELEASE_TAG']=='v'+p
          PYTHON
      - name: Reuse the locally qualified macOS ARM wheel
        if: matrix.target == 'aarch64-apple-darwin' && env.RELEASE_REQUESTED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          # Tag pushes can start this job before the local wheel is uploaded to
          # its draft release. Keep the automatic tag trigger and wait briefly
          # for that exact release asset to appear.
          for attempt in {1..20}; do
            rm -f dist/*.whl
            if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > /tmp/release-draft \
              && test "$(cat /tmp/release-draft)" = true \
              && gh release download "$RELEASE_TAG" --pattern 'weft_sql-*-cp39-abi3-macosx_*_arm64.whl' --dir dist; then
              break
            fi
            if test "$attempt" = 20; then
              echo "Timed out waiting for the draft release and locally qualified macOS ARM wheel" >&2
              exit 1
            fi
            sleep 30
          done
          python - <<'PYTHON'
          import hashlib,json,pathlib,tomllib
          report=json.loads(pathlib.Path('docs/helix/04-build/releases/local-macos-0.4.48.json').read_text())
          version=tomllib.load(open('crates/weft-python/pyproject.toml','rb'))['project']['version']
          wheel=pathlib.Path('dist')/report['wheel']['name']
          assert report['status']=='passed' and report['version']==version
          assert report['platform']=='macos-arm64' and report['functionalQualification']=='local-only'
          assert len(list(pathlib.Path('dist').glob('*.whl')))==1
          assert hashlib.sha256(wheel.read_bytes()).hexdigest()==report['wheel']['sha256']
          PYTHON
      - uses: PyO3/maturin-action@v1
        if: matrix.target != 'aarch64-apple-darwin' || env.RELEASE_REQUESTED != 'true'
        with:
          maturin-version: '1.9.6'
          rust-toolchain: '1.90.0'
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --manifest-path crates/weft-python/Cargo.toml --release --locked --out dist
      # Functional qualification is performed once locally on macOS. Hosted
      # targets build their native artifacts and check installed packaging only.
      - name: Check the exact installed wheel and notices
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          python - <<'PYTHON'
          import pathlib,subprocess,sys,tomllib
          version=tomllib.load(open('crates/weft-python/pyproject.toml','rb'))['project']['version']
          wheels=list(pathlib.Path('dist').glob('*.whl'));assert len(wheels)==1
          subprocess.run([sys.executable,'scripts/release/verify-wheel-packaging.py','--wheel',str(wheels[0]),'--version',version,'--output','dist/packaging-${{ matrix.target }}.json'],check=True)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: |
            dist/*.whl
            dist/packaging-*.json
          if-no-files-found: error
  publish:
    if: (github.ref_type == 'tag' || inputs.tag != '') && needs.wheels.result == 'success'
    needs: wheels
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Record exact artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          python - <<'PYTHON'
          import hashlib,json,os,pathlib,subprocess,tomllib,zipfile
          version=tomllib.load(open('crates/weft-python/pyproject.toml','rb'))['project']['version']
          root=pathlib.Path('dist');wheels=sorted(root.glob('*.whl'))
          assert len(wheels)==5
          packaging=[json.loads(p.read_text()) for p in sorted(root.glob('packaging-*.json'))]
          assert len(packaging)==5 and {p['wheel']for p in packaging}=={w.name for w in wheels}
          for report in packaging:
              assert report['status']=='passed' and report['version']==version
              assert report['wheelSha256']==hashlib.sha256((root/report['wheel']).read_bytes()).hexdigest()
              with zipfile.ZipFile(root/report['wheel'])as archive:
                  modules=[n for n in archive.namelist()if n.endswith(('.so','.pyd'))]
                  assert len(modules)==1 and report['nativeModuleSha256']==hashlib.sha256(archive.read(modules[0])).hexdigest()
          features=tomllib.load(open('crates/weft-python/pyproject.toml','rb'))['tool']['maturin']['features']
          # The local qualification report is source-controlled with this tag.
          # It records its actual platform and scope; target packaging reports
          # do not promote it to native execution on other operating systems.
          qualification=pathlib.Path('docs/helix/04-build/releases/local-macos-0.4.48.json')
          report=json.loads(qualification.read_text())
          assert report['status']=='passed' and report['version']==version
          assert report['platform']=='macos-arm64' and report['functionalQualification']=='local-only'
          (root/'local-macos-qualification.json').write_bytes(qualification.read_bytes())
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in wheels))
          (root/'release-pins.json').write_text(json.dumps({'tag':os.environ['RELEASE_TAG'],'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'distribution':'weft-sql','version':version,'features':features,'wheelPackaging':packaging,'functionalQualification':report,'otherPlatforms':'build and installed packaging only; no native functional qualification claimed','rust':'1.90.0','maturin':'1.9.6'},indent=2)+'\n')
          PYTHON
          gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > /tmp/release-draft
          test "$(cat /tmp/release-draft)" = true
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
