name: Release Python wheels
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: '2014'}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: '2014'}
          - {os: macos-14, target: aarch64-apple-darwin, manylinux: auto}
          - {os: macos-15-intel, target: x86_64-apple-darwin, manylinux: auto}
          - {os: windows-2022, target: x86_64-pc-windows-msvc, manylinux: auto}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check distribution and crate version against tag
        shell: bash
        run: |
          python - <<'PYTHON'
          import os,tomllib
          p=tomllib.load(open('crates/weft-python/pyproject.toml','rb'))['project']['version']
          c=tomllib.load(open('crates/weft-python/Cargo.toml','rb'))['package']['version']
          assert p==c
          if os.environ['GITHUB_REF_TYPE']=='tag':assert os.environ['GITHUB_REF_NAME']=='v'+p
          PYTHON
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.9.6'
          rust-toolchain: '1.90.0'
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --manifest-path crates/weft-python/Cargo.toml --release --locked --features truss-postgresql-pg18 --out dist
      - name: Smoke the exact wheel to be published
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          python - <<'PYTHON'
          import importlib.metadata,json,tomllib,weft
          expected=tomllib.load(open('crates/weft-python/pyproject.toml','rb'))['project']['version']
          assert importlib.metadata.version('weft-sql')==weft.__version__==expected
          result=json.loads(weft.compile_truss_runtime_json('{}'))
          assert isinstance(result,dict)
          assert callable(weft.compile_truss_runtime_page_json)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
  publish:
    if: github.ref_type == 'tag'
    needs: wheels
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Record exact artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          python - <<'PYTHON'
          import hashlib,json,os,pathlib,tomllib
          version=tomllib.load(open('crates/weft-python/pyproject.toml','rb'))['project']['version']
          root=pathlib.Path('dist');wheels=sorted(root.glob('*.whl'))
          assert len(wheels)==5
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in wheels))
          (root/'release-pins.json').write_text(json.dumps({'tag':os.environ['GITHUB_REF_NAME'],'commit':os.environ['GITHUB_SHA'],'distribution':'weft-sql','version':version,'features':['truss-postgresql-pg18'],'trussBackend':'0.4.8','rust':'1.90.0','maturin':'1.9.6'},indent=2)+'\n')
          PYTHON
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > /tmp/release-draft; then
            test "$(cat /tmp/release-draft)" = true
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Weft ${GITHUB_REF_NAME}" --notes-file "docs/helix/04-build/releases/${GITHUB_REF_NAME}.md"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
