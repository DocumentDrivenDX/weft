name: Release Python wheels
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (empty builds only)
        required: false
        default: ''
        type: string
      promote_run_id:
        description: Existing wheel run to promote without rebuilding (requires tag)
        required: false
        default: ''
        type: string
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REQUESTED: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
permissions:
  contents: read
concurrency:
  group: python-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  wheels:
    if: inputs.promote_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: '2014'}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: '2014'}
          - {os: macos-14, target: aarch64-apple-darwin, manylinux: auto}
          - {os: macos-15-intel, target: x86_64-apple-darwin, manylinux: auto}
          - {os: windows-2022, target: x86_64-pc-windows-msvc, manylinux: auto}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Preserve source bytes and support Windows long paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check distribution and crate version against tag
        shell: bash
        run: |
          python - <<'PYTHON'
          import os,tomllib
          p=tomllib.load(open('crates/weft-python/pyproject.toml','rb'))['project']['version']
          c=tomllib.load(open('crates/weft-python/Cargo.toml','rb'))['package']['version']
          assert p==c
          if os.environ['RELEASE_REQUESTED']=='true':assert os.environ['RELEASE_TAG']=='v'+p
          PYTHON
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.9.6'
          rust-toolchain: '1.90.0'
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --manifest-path crates/weft-python/Cargo.toml --release --locked --out dist
      - name: Smoke the exact wheel to be published
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          python - <<'PYTHON'
          import importlib.metadata,json,tomllib,weft
          expected=tomllib.load(open('crates/weft-python/pyproject.toml','rb'))['project']['version']
          assert importlib.metadata.version('weft-sql')==weft.__version__==expected
          result=json.loads(weft.compile_truss_runtime_json('{}'))
          assert isinstance(result,dict)
          assert callable(weft.compile_truss_runtime_page_json)
          PYTHON
          python tests/mutation/native066-wheel-smoke.py
          python tests/truss-catalog-capacity/wheel-smoke.py > dist/truss-catalog-capacity-${{ matrix.target }}.json
          python tests/current-query-designation/wheel-smoke.py --wheel dist/*.whl --output dist/current-query-smoke-${{ matrix.target }}.json
      - name: Verify exact installed wheel packaging and notices
        shell: bash
        run: |
          python - <<'PYTHON'
          import importlib.metadata,pathlib,subprocess,sys
          version=importlib.metadata.version('weft-sql')
          if tuple(map(int,version.split('.')[:3])) >= (0,4,40):
              subprocess.run([sys.executable,'scripts/release/test-wheel-packaging-version-gate.py'],check=True)
              wheels=list(pathlib.Path('dist').glob('*.whl'));assert len(wheels)==1
              subprocess.run([sys.executable,'scripts/release/verify-wheel-packaging.py','--wheel',str(wheels[0]),'--version',version,'--output','dist/packaging-${{ matrix.target }}.json'],check=True)
          PYTHON
      - name: Smoke native68 namespace and mutation bindings
        if: hashFiles('tests/truss068/wheel-smoke.py') != ''
        shell: bash
        run: python tests/truss068/wheel-smoke.py
      - name: Smoke Databricks APIs from the exact standard wheel
        if: hashFiles('tests/current-scalar-databricks/wheel-smoke.py') != ''
        shell: bash
        run: python tests/current-scalar-databricks/wheel-smoke.py --wheel dist/*.whl --output dist/current-databricks-smoke-${{ matrix.target }}.json
      - name: Smoke conditional refinement APIs from the exact standard wheel
        if: hashFiles('tests/current-query-refinement/wheel-smoke.py') != ''
        shell: bash
        run: python tests/current-query-refinement/wheel-smoke.py --wheel dist/*.whl --output dist/current-refinement-smoke-${{ matrix.target }}.json
      - name: Test closed refinement publication gate
        if: hashFiles('scripts/release/test-refinement-smoke-gate.py') != ''
        shell: bash
        run: python scripts/release/test-refinement-smoke-gate.py
      - name: Smoke explicit Truss query ABI from the exact standard wheel
        if: hashFiles('tests/truss-query-abi/wheel-smoke.py') != ''
        shell: bash
        run: python tests/truss-query-abi/wheel-smoke.py
      - name: Test closed Decimal12 publication gate
        if: hashFiles('scripts/release/test-decimal12-smoke-gate.py') != ''
        shell: bash
        run: python scripts/release/test-decimal12-smoke-gate.py
      - name: Smoke explicit Decimal12 domains from the exact standard wheel
        if: hashFiles('tests/truss-decimal12/wheel-smoke.py') != ''
        shell: bash
        run: python tests/truss-decimal12/wheel-smoke.py --wheel dist/*.whl --output dist/truss-decimal12-smoke-${{ matrix.target }}.json
      - name: Smoke native70 queries from each exact standard wheel
        shell: bash
        run: |
          python scripts/release/test-native70-smoke-gate.py
          python tests/truss070/wheel-smoke.py --wheel dist/*.whl --output dist/truss-native70-smoke-${{ matrix.target }}.json
      - name: Smoke canonical dates from each exact standard wheel
        if: hashFiles('tests/truss-date/wheel-smoke.py') != ''
        shell: bash
        run: |
          python scripts/release/test-date-smoke-gate.py
          python tests/truss-date/wheel-smoke.py --wheel dist/*.whl --output dist/truss-date-smoke-${{ matrix.target }}.json
      - name: Smoke SDK read, page, cursor export and null-safe predicates from each exact wheel
        shell: bash
        run: |
          python scripts/release/test-sdk-smoke-gate.py
          python tests/engine-catalog/wheel-smoke.py --wheel dist/*.whl --output dist/sdk-compiler-smoke-${{ matrix.target }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: |
            dist/*.whl
            dist/packaging-*.json
            dist/current-query-smoke-*.json
            dist/current-databricks-smoke-*.json
            dist/current-refinement-smoke-*.json
            dist/truss-decimal12-smoke-*.json
            dist/truss-native70-smoke-*.json
            dist/truss-date-smoke-*.json
            dist/sdk-compiler-smoke-*.json
          if-no-files-found: error
  publish:
    if: always() && (github.ref_type == 'tag' || inputs.tag != '') && (needs.wheels.result == 'success' || (needs.wheels.result == 'skipped' && inputs.promote_run_id != ''))
    needs: wheels
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - name: Validate promoted wheel run
        if: inputs.promote_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_RUN_ID: ${{ inputs.promote_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/release/verify-promotion.py?ref=$GITHUB_SHA" --jq .content | base64 --decode > /tmp/verify-promotion.py
          python /tmp/verify-promotion.py "$PROMOTE_RUN_ID" "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.promote_run_id || github.run_id }}
          github-token: ${{ github.token }}
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Record exact artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          python - <<'PYTHON'
          import hashlib,json,os,pathlib,runpy,subprocess,tomllib,zipfile
          version=tomllib.load(open('crates/weft-python/pyproject.toml','rb'))['project']['version']
          root=pathlib.Path('dist');wheels=sorted(root.glob('*.whl'))
          assert len(wheels)==5
          packaging=[json.loads(p.read_text()) for p in sorted(root.glob('packaging-*.json'))]
          packaging_required=tuple(map(int,version.split('.')[:3])) >= (0,4,40)
          if packaging_required:
              assert len(packaging)==5 and {p['wheel']for p in packaging}=={w.name for w in wheels}
          else:
              assert packaging==[]
          for report in packaging:
              assert report['status']=='passed' and report['version']==version
              assert report['wheelSha256']==hashlib.sha256((root/report['wheel']).read_bytes()).hexdigest()
              with zipfile.ZipFile(root/report['wheel'])as archive:
                  modules=[n for n in archive.namelist()if n.endswith(('.so','.pyd'))]
                  assert len(modules)==1 and report['nativeModuleSha256']==hashlib.sha256(archive.read(modules[0])).hexdigest()
          smoke=[json.loads(p.read_text()) for p in sorted(root.glob('current-query-smoke-*.json'))]
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert len(smoke)==5 and {r['wheel'] for r in smoke}=={p.name for p in wheels}
          for report in smoke:
              assert report['sourceCommit']==commit and report['version']==version
              assert len(report['checks'])==4 and report['nativeAdmission'] is False and report['securityReady'] is False
              assert report['pinsBeforeAfter']['wheelSha256']==hashlib.sha256((root/report['wheel']).read_bytes()).hexdigest()
              assert report['checks']==smoke[0]['checks'] and report['checks'][-1]=={'id':'no-context-downgrade','refused':True}
              with zipfile.ZipFile(root/report['wheel']) as archive:
                  modules=[n for n in archive.namelist() if n.endswith(('.so','.pyd'))]
                  assert len(modules)==1
                  assert report['pinsBeforeAfter']['nativeModuleSha256']==hashlib.sha256(archive.read(modules[0])).hexdigest()
                  assert report['pinsBeforeAfter']['shimSha256']==hashlib.sha256(archive.read('weft/__init__.py')).hexdigest()

          features=tomllib.load(open('crates/weft-python/pyproject.toml','rb'))['tool']['maturin']['features']
          databricks=[json.loads(p.read_text()) for p in sorted(root.glob('current-databricks-smoke-*.json'))]
          if 'current-databricks-scalar-candidate' in features:
              assert len(databricks)==5 and {r['wheel'] for r in databricks}=={p.name for p in wheels}
              by_wheel={r['wheel']:r for r in smoke}
              for report in databricks:
                  assert report['sourceCommit']==commit and report['version']==version and report['controls']==32
                  assert report['nativeAdmission'] is False and report['securityReady'] is False
                  assert report['pinsBeforeAfter']==by_wheel[report['wheel']]['pinsBeforeAfter']
          else:
              assert databricks==[]

          refinement=[json.loads(p.read_text()) for p in sorted(root.glob('current-refinement-smoke-*.json'))]
          if 'current-query-refinement-candidate' in features:
              gate=runpy.run_path('scripts/release/verify-refinement-smoke.py')
              gate['validate'](refinement,smoke,commit,version)
          else:
              assert refinement==[]

          decimal12=[json.loads(p.read_text()) for p in sorted(root.glob('truss-decimal12-smoke-*.json'))]
          decimal12_required=tuple(map(int,version.split('.'))) >= (0,4,36)
          if decimal12_required:
              gate=runpy.run_path('scripts/release/verify-decimal12-smoke.py')
              gate['validate'](decimal12,smoke,commit,version)
          else:
              assert decimal12==[]

          native70_reports=[json.loads(p.read_text()) for p in sorted(root.glob('truss-native70-smoke-*.json'))]
          native70_required=tuple(map(int,version.split('.'))) >= (0,4,37)
          if native70_required:
              gate=runpy.run_path('scripts/release/verify-native70-smoke.py')
              gate['validate'](native70_reports,smoke,commit,version)
          else:
              assert native70_reports==[]

          date_reports=[json.loads(p.read_text()) for p in sorted(root.glob('truss-date-smoke-*.json'))]
          date_required=tuple(map(int,version.split('.'))) >= (0,4,39)
          date_backend=None
          if date_required:
              gate=runpy.run_path('scripts/release/verify-date-smoke.py')
              gate['validate'](date_reports,smoke,commit,version)
              date_backend={'backendVersion':'0.4.41','targetProfile':'truss-runtime-pg18.6/0.5','bindingProfile':'truss-runtime-binding/0.5','queryAbi':gate['ABI'],'nativeAdmission':False}
          else:
              assert date_reports==[]

          sdk_reports=[json.loads(p.read_text()) for p in sorted(root.glob('sdk-compiler-smoke-*.json'))]
          sdk_required=tuple(map(int,version.split('.'))) >= (0,4,41)
          if sdk_required:
              gate=runpy.run_path('scripts/release/verify-sdk-smoke.py')
              gate['validate'](sdk_reports,smoke,commit,version)
          else:
              assert sdk_reports==[]

          query_abi_path=pathlib.Path('tests/truss-query-abi/fixtures/query-abi.json')
          query_abi_backend=None
          if query_abi_path.exists():
              raw=query_abi_path.read_bytes();abi=json.loads(raw)
              assert hashlib.sha256(raw).hexdigest()=='9fce2c91eff11ae2d8e6c0e3759b425efb1457e2c9675dc4383fc28430909806'
              assert abi['identity']=='truss-postgresql-logical-query' and abi['version']=='1.0'
              query_abi_backend={'backendVersion':'0.4.38','targetProfile':'truss-runtime-pg18.6/0.5','bindingProfile':'truss-runtime-binding/0.5','queryAbi':{'identity':abi['identity'],'version':abi['version'],'sha256':hashlib.sha256(raw).hexdigest()},'nativeAdmission':False}

          runtimes=[{'releaseId':'truss-catalog-runtime/0.66-candidate','sha256':'99ae7218e0e3e68e0a3682e43949089185d967eb21bbf31deb0b8f8f6fc2de9a'},{'releaseId':'truss-catalog-runtime/0.67-candidate','sha256':'8c553480e1bcb95ccaebb9aa04150a0253217838c8df6ad09acd5ecece2402ee'}]
          native68=pathlib.Path('tests/truss068/native-runtime-manifest.json')
          if native68.exists():
              raw=native68.read_bytes();manifest=json.loads(raw)
              assert manifest['releaseId']=='truss-catalog-runtime/0.68-candidate'
              assert hashlib.sha256(raw).hexdigest()=='3588cf030cb46c7d12368557e351bd767c10b4dd2e1644f7f100cec54602a2fc'
              runtimes.append({'releaseId':manifest['releaseId'],'sha256':hashlib.sha256(raw).hexdigest()})
          if native70_required:
              raw=pathlib.Path('tests/truss070/native-runtime-manifest.json').read_bytes();manifest=json.loads(raw)
              assert manifest['releaseId']=='truss-catalog-runtime/0.70-candidate'
              assert hashlib.sha256(raw).hexdigest()=='0d292c3681986b3664ff3af9927039d10cf20ef029511e33ccd7d76c566041e3'
              runtimes.append({'releaseId':manifest['releaseId'],'sha256':hashlib.sha256(raw).hexdigest()})
          latest=runtimes[-1]

          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in wheels))
          (root/'release-pins.json').write_text(json.dumps({'tag':os.environ['RELEASE_TAG'],'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'workflowCommit':os.environ['GITHUB_SHA'],'distribution':'weft-sql','version':version,'features':features,'wheelPackaging':packaging,'currentQuerySmoke':smoke,'sdkCompilerSmoke':sdk_reports,'sdkTemporalQualification':'held','currentDatabricksSmoke':databricks,'currentQueryRefinementSmoke':refinement,'trussDecimal12Smoke':decimal12,'trussDecimal12Backend':({'backendVersion':'0.4.39','targetProfile':'truss-runtime-pg18.6/0.5','bindingProfile':'truss-runtime-binding/0.5','capability':'type.decimal12Scale2','nativeAdmission':False} if decimal12_required else None),'trussQueryAbiBackend':query_abi_backend,'trussDateBackend':date_backend,'trussDateSmoke':date_reports,'trussBackendSelection':'closed-runtime-hash','trussNative70Smoke':native70_reports,'trussBackend':'0.4.40' if native70_required else ('0.4.37' if native68.exists() else '0.4.36'),'trussRuntime':latest['releaseId'],'trussRuntimeSha256':latest['sha256'],'supportedTrussRuntimes':runtimes,'trussSupportProfile':'0.17','timestampComparisonProfile':'umf-rfc3339-exact-instant/1.0.0','umfExactInstantCommit':'cbb6fb87','rust':'1.90.0','maturin':'1.9.6'},indent=2)+'\n')
          catalog_reports=[json.loads(p.read_text()) for p in sorted(root.glob('truss-catalog-capacity-*.json'))]
          assert len(catalog_reports)==5 and all(r['status']=='passed' and r['compiler']==version and r['records']==1000 and r['controls']==5 for r in catalog_reports)
          pins=json.loads((root/'release-pins.json').read_text())
          pins['trussCatalogCapacitySmoke']={'reports':catalog_reports,'nativeExecution':False}
          (root/'release-pins.json').write_text(json.dumps(pins,indent=2)+'\n')
          PYTHON
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > /tmp/release-draft; then
            test "$(cat /tmp/release-draft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Weft ${RELEASE_TAG}" --notes-file "docs/helix/04-build/releases/${RELEASE_TAG}.md"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
