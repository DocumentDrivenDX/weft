name: Release Python wheels
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (empty builds only)
        required: false
        default: ''
        type: string
      packaging_run_id:
        description: Reuse completed packaging artifacts with identical frozen compiler/build inputs
        required: false
        default: ''
        type: string
      macos_run_id:
        description: Successful release-hosted-macos.yml run that produced the exact ARM64 artifact
        required: false
        default: ''
        type: string
      macos_source_sha:
        description: Exact reviewed main source SHA recorded by that ARM64 producer
        required: false
        default: ''
        type: string
      source_sha:
        description: Exact reviewed main commit for a new hosted three-platform release
        required: false
        default: ''
        type: string
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REQUESTED: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
permissions:
  contents: read
concurrency:
  group: python-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  route:
    runs-on: ubuntu-24.04
    outputs:
      hosted_macos: ${{ steps.profile.outputs.hosted_macos }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_sha || (inputs.tag && format('refs/tags/{0}', inputs.tag)) || github.sha }}
      - uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          python-version: '3.12'
      - id: profile
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          MACOS_RUN_ID: ${{ inputs.macos_run_id }}
          MACOS_SOURCE_SHA: ${{ inputs.macos_source_sha }}
        run: |
          python - <<'PY'
          import os,sys,tomllib
          sys.path.insert(0,'scripts/release')
          from publish_pypi_release import distribution_for_version
          project=tomllib.load(open('crates/weft-python/pyproject.toml','rb'))['project']
          assert project['name']==distribution_for_version(project['version'])
          hosted='true' if project['name']=='umf-weft' else 'false'
          if hosted=='true' and os.environ['MACOS_RUN_ID']:
              assert os.environ['SOURCE_SHA']==os.environ['GITHUB_SHA']
              assert os.environ['MACOS_SOURCE_SHA']==os.environ['SOURCE_SHA']
              assert os.environ['GITHUB_REF']=='refs/heads/main'
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write(f'hosted_macos={hosted}\n')
          PY
  wheels:
    # v0.4.50 and v0.4.52 have separate selected-assets paths. Never start the
    # legacy platform matrix for those tags; their promotion workflows consume
    # the exact selected Linux build plus staged macOS qualification assets.
    if: inputs.packaging_run_id == '' && github.ref_name != 'v0.4.50' && inputs.tag != 'v0.4.50' && github.ref_name != 'v0.4.52' && inputs.tag != 'v0.4.52' && github.ref_name != 'v0.4.54' && inputs.tag != 'v0.4.54'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: '2014'}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: '2014'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Preserve source bytes and support Windows long paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || (inputs.tag && format('refs/tags/{0}', inputs.tag)) || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check distribution and crate version against tag
        shell: bash
        run: |
          python - <<'PYTHON'
          import os,sys,tomllib
          sys.path.insert(0,'scripts/release')
          from publish_pypi_release import distribution_for_version,wheel_prefix_for_version
          project=tomllib.load(open('crates/weft-python/pyproject.toml','rb'))['project']
          p=project['version']
          c=tomllib.load(open('crates/weft-python/Cargo.toml','rb'))['package']['version']
          assert p==c
          expected_name=distribution_for_version(p)
          assert project['name']==expected_name, (project['name'], expected_name)
          prefix=wheel_prefix_for_version(p)
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write(f'DISTRIBUTION={project["name"]}\nWHEEL_PREFIX={prefix}\n')
          if os.environ['RELEASE_REQUESTED']=='true':assert os.environ['RELEASE_TAG']=='v'+p
          PYTHON
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.9.6'
          rust-toolchain: '1.90.0'
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --manifest-path crates/weft-python/Cargo.toml --release --locked --out dist
      # Legacy releases retain their existing macOS qualification process.
      # The renamed umf-weft cohort uses release-hosted-macos.yml for its
      # bounded hosted ARM64 refusal-parity profile.
      - name: Check the exact installed wheel and notices
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          python - <<'PYTHON'
          import json,os,pathlib,subprocess,sys,tomllib,zipfile
          version=tomllib.load(open('crates/weft-python/pyproject.toml','rb'))['project']['version']
          root=pathlib.Path('dist');wheels=list(root.glob('*.whl'));assert len(wheels)==1
          report=root/'packaging-${{ matrix.target }}.json'
          subprocess.run([sys.executable,'scripts/release/verify-wheel-packaging.py','--wheel',str(wheels[0]),'--version',version,'--distribution',os.environ['DISTRIBUTION'],'--output',str(report)],check=True)
          evidence=json.loads(report.read_text())
          with zipfile.ZipFile(wheels[0]) as archive:
              modules=[name for name in archive.namelist() if name.endswith(('.so','.pyd'))]
          assert len(modules)==1
          evidence.update({'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'distribution':os.environ['DISTRIBUTION'],'target':'${{ matrix.target }}','nativeModule':modules[0]})
          report.write_text(json.dumps(evidence,indent=2)+'\n')
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: |
            dist/*.whl
            dist/packaging-*.json
          if-no-files-found: error
  publish:
    if: always() && needs.route.result == 'success' && github.ref_name != 'v0.4.50' && inputs.tag != 'v0.4.50' && github.ref_name != 'v0.4.52' && inputs.tag != 'v0.4.52' && github.ref_name != 'v0.4.54' && inputs.tag != 'v0.4.54' && (github.ref_type == 'tag' || inputs.tag != '') && (needs.wheels.result == 'success' || (needs.wheels.result == 'skipped' && inputs.packaging_run_id != '')) && (needs.route.outputs.hosted_macos != 'true' || (inputs.macos_run_id != '' && inputs.macos_source_sha != ''))
    needs: [wheels, route]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_sha || (inputs.tag && format('refs/tags/{0}', inputs.tag)) || github.sha }}
      - uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.packaging_run_id || github.run_id }}
          github-token: ${{ github.token }}
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Verify hosted ARM64 producer and publish exact three-platform release
        if: inputs.macos_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGING_RUN_ID: ${{ inputs.packaging_run_id }}
          MACOS_RUN_ID: ${{ inputs.macos_run_id }}
          MACOS_SOURCE_SHA: ${{ inputs.macos_source_sha }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          case "$MACOS_RUN_ID" in *[!0-9]*|'') exit 1;; esac
          test "${#MACOS_SOURCE_SHA}" = 40
          case "$MACOS_SOURCE_SHA" in *[!0-9a-f]*) exit 1;; esac
          python scripts/release/verify_hosted_macos_artifact.py \
            --run-id "$MACOS_RUN_ID" --source-sha "$MACOS_SOURCE_SHA" \
            --version "$(python -c 'import tomllib;print(tomllib.load(open("crates/weft-python/pyproject.toml","rb"))["project"]["version"])')" \
            --distribution "$(python -c 'import tomllib;print(tomllib.load(open("crates/weft-python/pyproject.toml","rb"))["project"]["name"])')" \
            --repository "$GH_REPOSITORY" --output-dir dist/macos \
            --receipt dist/macos-artifact-verification.json
          SOURCE_SHA="$MACOS_SOURCE_SHA" MACOS_RUN_ID="$MACOS_RUN_ID" PACKAGING_RUN_ID="$PACKAGING_RUN_ID" RELEASE_TAG="$RELEASE_TAG" GH_REPOSITORY="$GH_REPOSITORY" GH_TOKEN="$GH_TOKEN" python scripts/release/publish_hosted_release.py --dist dist
      - name: Record exact artifacts and publish
        if: inputs.macos_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGING_RUN_ID: ${{ inputs.packaging_run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          # Documentation/release-validation fixes need not rebuild unchanged
          # compiler artifacts. Prove the packaging source is an ancestor and
          # all compiler, build, owner-schema and contract inputs are identical.
          PACKAGING_COMMIT=$(git rev-parse HEAD)
          if test -n "$PACKAGING_RUN_ID"; then
            case "$PACKAGING_RUN_ID" in *[!0-9]*) exit 1;; esac
            PACKAGING_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGING_RUN_ID" --jq .head_sha)
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGING_RUN_ID" --jq .conclusion)" = success
            git merge-base --is-ancestor "$PACKAGING_COMMIT" HEAD
            git diff --exit-code "$PACKAGING_COMMIT" HEAD -- Cargo.toml Cargo.lock crates spec vendor .cargo rust-toolchain rust-toolchain.toml docs/helix/02-design/contracts
            PACKAGING_COMMIT="$PACKAGING_COMMIT" python - <<'PYTHON'
          import os,subprocess
          path='.github/workflows/release.yml'
          old=subprocess.check_output(['git','show',os.environ['PACKAGING_COMMIT']+':'+path],text=True)
          new=open(path).read()
          def section(text,start,end):
              return text.split(start,1)[1].split(end,1)[0]
          for start,end in [('\nenv:\n','\npermissions:\n'),('  wheels:\n','  publish:\n')]:
              assert section(old,start,end)==section(new,start,end),'Packaging workflow inputs differ'
          PYTHON
          fi
          export PACKAGING_COMMIT
          # The publisher already has release access. Build jobs remain read-only;
          # macOS functional and installed-package checks ran locally.
          read -r DISTRIBUTION WHEEL_PREFIX < <(python - <<'PYTHON'
          import sys,tomllib
          sys.path.insert(0,'scripts/release')
          from publish_pypi_release import distribution_for_version,wheel_prefix_for_version
          project=tomllib.load(open('crates/weft-python/pyproject.toml','rb'))['project']
          assert project['name']==distribution_for_version(project['version'])
          print(project['name'],wheel_prefix_for_version(project['version']))
          PYTHON
          )
          export DISTRIBUTION WHEEL_PREFIX
          gh release download "$RELEASE_TAG" --pattern "${WHEEL_PREFIX}*-cp39-abi3-macosx_*_arm64.whl" --dir dist
          python - <<'PYTHON'
          import hashlib,json,os,pathlib,subprocess,tomllib,zipfile
          version=tomllib.load(open('crates/weft-python/pyproject.toml','rb'))['project']['version']
          root=pathlib.Path('dist');wheels=sorted(root.glob('*.whl'))
          assert len(wheels)==3
          local=json.loads(pathlib.Path(f'docs/helix/04-build/releases/local-macos-{version}.json').read_text())
          assert local['status']=='passed' and local['version']==version
          assert local['platform']=='macos-arm64' and local['functionalQualification']=='local-only'
          source_freeze=local['sourceFreezeCommit']
          assert len(source_freeze)==40 and all(c in '0123456789abcdef' for c in source_freeze)
          compiler_inputs=['Cargo.toml','Cargo.lock','crates','spec','vendor','.cargo','rust-toolchain','rust-toolchain.toml','docs/helix/02-design/contracts']
          subprocess.run(['git','merge-base','--is-ancestor',source_freeze,'HEAD'],check=True)
          subprocess.run(['git','diff','--exit-code',source_freeze,'HEAD','--',*compiler_inputs],check=True)
          mac=root/local['wheel']['name']
          assert hashlib.sha256(mac.read_bytes()).hexdigest()==local['wheel']['sha256']
          (root/'packaging-aarch64-apple-darwin.json').write_text(json.dumps({'status':'passed','version':version,'wheel':mac.name,'wheelSha256':local['wheel']['sha256'],'nativeModuleSha256':local['nativeModuleSha256'],'sourceCommit':source_freeze,'scope':'local macOS exact installed archive, RECORD, metadata, ABI and notices checks; reused without another hosted run'},indent=2)+'\n')
          packaging=[json.loads(p.read_text()) for p in sorted(root.glob('packaging-*.json'))]
          assert len(packaging)==3 and {p['wheel']for p in packaging}=={w.name for w in wheels}
          linux=[p for p in packaging if p['wheel']!=mac.name]
          assert len(linux)==2
          packaging_commit=os.environ['PACKAGING_COMMIT']
          assert len(packaging_commit)==40 and all(c in '0123456789abcdef' for c in packaging_commit)
          assert all(p.get('sourceCommit')==packaging_commit for p in linux),'Linux packaging checkout must equal the resolved packaging run head SHA'
          assert next(p for p in packaging if p['wheel']==mac.name).get('sourceCommit')==source_freeze
          for report in packaging:
              assert report['status']=='passed' and report['version']==version
              assert report['wheelSha256']==hashlib.sha256((root/report['wheel']).read_bytes()).hexdigest()
              with zipfile.ZipFile(root/report['wheel'])as archive:
                  modules=[n for n in archive.namelist()if n.endswith(('.so','.pyd'))]
                  assert len(modules)==1 and report['nativeModuleSha256']==hashlib.sha256(archive.read(modules[0])).hexdigest()
          features=tomllib.load(open('crates/weft-python/pyproject.toml','rb'))['tool']['maturin']['features']
          # The local qualification report is source-controlled with this tag.
          # It records its actual platform and scope; target packaging reports
          # do not promote it to native execution on other operating systems.
          qualification=pathlib.Path(f'docs/helix/04-build/releases/local-macos-{version}.json')
          report=json.loads(qualification.read_text())
          assert report['status']=='passed' and report['version']==version
          assert report['platform']=='macos-arm64' and report['functionalQualification']=='local-only'
          (root/'local-macos-qualification.json').write_bytes(qualification.read_bytes())
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in wheels))
          (root/'release-pins.json').write_text(json.dumps({'tag':os.environ['RELEASE_TAG'],'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'workflowCommit':os.environ['GITHUB_SHA'],'workflowRunId':int(os.environ['GITHUB_RUN_ID']),'packagingCommit':os.environ['PACKAGING_COMMIT'],'distribution':os.environ['DISTRIBUTION'],'version':version,'features':features,'wheelPackaging':packaging,'functionalQualification':report,'otherPlatforms':'build and installed packaging only; no native functional qualification claimed','rust':'1.90.0','maturin':'1.9.6'},indent=2)+'\n')
          PYTHON
          gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > /tmp/release-draft
          test "$(cat /tmp/release-draft)" = true
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - uses: actions/upload-artifact@v4
        with:
          name: weft-pypi-intent-${{ github.run_id }}
          path: |
            dist/release-pins.json
            dist/SHA256SUMS
            dist/release-api-assets.json
          if-no-files-found: error
          retention-days: 90
