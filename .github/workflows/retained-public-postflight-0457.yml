name: Closed 0.4.57 retained public proof projection
on:
  workflow_dispatch:
    inputs:
      project_retained_proof:
        type: boolean
        default: false
      controller_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: weft-0457-retained-public-proof-projection
  cancel-in-progress: false
jobs:
  retention-projector:
    if: inputs.project_retained_proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PROJECTOR_CONTROLLER_SHA: ${{ inputs.controller_sha }}
    steps:
      - name: Initialize bounded projector state outside upload capsule
        run: |
          mkdir -p "$RUNNER_TEMP/weft-postflight-projector-state"
          printf '{"status":"incomplete","controller":"%s","run":"%s","attempt":"%s","originalArtifactAccepted":false}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/weft-postflight-projector-state/initial.json"
      - uses: actions/checkout@v6
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        timeout-minutes: 3
        with:
          python-version: '3.11'
      - name: Test retention-only projection controls
        run: python -m unittest discover -s scripts/release -p test_retained_public_postflight_0457.py -v
      - name: Reauthenticate quarantine and project only original whitelisted proof
        id: project
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release/project_retained_public_postflight_0457.py \
            --controller-sha "$PROJECTOR_CONTROLLER_SHA" \
            --quarantine "$RUNNER_TEMP/weft-postflight-projector-quarantine" \
            --state "$RUNNER_TEMP/weft-postflight-projector-state" \
            --out "$RUNNER_TEMP/weft-postflight-projector-upload" \
            2>&1 | tee "$RUNNER_TEMP/weft-postflight-projector-state/operation.log"
      - name: Upload only bounded projection capsule
        if: success()
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: weft-retained-public-proof-0457-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weft-postflight-projector-upload/
          if-no-files-found: error
          retention-days: 365
      - name: Preserve failed projector metadata only
        if: failure()
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: failed-weft-retained-proof-0457-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weft-postflight-projector-state/
          if-no-files-found: error
          retention-days: 365
