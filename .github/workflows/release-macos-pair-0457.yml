name: Closed 0.4.57 Mac product-R controller-Q qualification
on:
  workflow_dispatch:
    inputs:
      prepare_pair:
        type: boolean
        default: false
      registration_sha:
        description: Reviewed main registration commit binding exact product R and controller Q
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: weft-0457-macos-pair-c623b94b
  cancel-in-progress: false
jobs:
  macos-pair:
    if: inputs.prepare_pair
    runs-on: macos-14
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: '1.90.0'
      REGISTRATION_SHA: ${{ inputs.registration_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start original bounded pair budget
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mac-pair/evidence"
          printf '{"status":"incomplete","sourceCommit":"c623b94b66b0b46d492d457c62faddc896e2e452","workflowCommit":"%s"}\n' "$GITHUB_SHA" > "$RUNNER_TEMP/mac-pair/evidence/phase.json"
          echo "WEFT_RELEASE_DEADLINE_MONOTONIC=$(python3 -c 'import time;print(time.monotonic()+5400)')" >> "$GITHUB_ENV"
          echo "PAIR_OUT=$RUNNER_TEMP/mac-pair/evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v6
        timeout-minutes: 5
        with:
          ref: c623b94b66b0b46d492d457c62faddc896e2e452
          path: product
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          python-version: '3.12'
      - name: Admit exact registered R Q and complete source closure
        run: python controller/scripts/release/run_macos_pair_0457.py --phase preflight --target aarch64-apple-darwin --product-root "$GITHUB_WORKSPACE/product" --out "$PAIR_OUT" --registration-sha "$REGISTRATION_SHA"
      - uses: oven-sh/setup-bun@v2
        timeout-minutes: 5
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'
      - name: Record original selected Mac runner before tool acquisition
        run: python controller/scripts/release/run_macos_pair_0457.py --phase runner --target aarch64-apple-darwin --product-root "$GITHUB_WORKSPACE/product" --out "$PAIR_OUT"
      - name: Install original pinned tools with original bounds
        shell: bash
        run: |
          set -euo pipefail
          Q="$GITHUB_WORKSPACE/controller/scripts/release"
          python "$Q/run_bounded_0454.py" --stage rust-toolchain --seconds 480 --grace-seconds 30 --log "$PAIR_OUT/rust-toolchain.log" --receipt "$PAIR_OUT/rust-toolchain-command.json" -- rustup toolchain install 1.90.0 --profile minimal --target aarch64-apple-darwin --target wasm32-unknown-unknown --component rustfmt
          python "$Q/run_bounded_0454.py" --stage maturin-install --seconds 300 --grace-seconds 30 --log "$PAIR_OUT/maturin-install.log" --receipt "$PAIR_OUT/maturin-install-command.json" -- python -m pip install --no-deps maturin==1.9.6
          python "$Q/run_bounded_0454.py" --stage wasm-bindgen-install --seconds 480 --grace-seconds 30 --log "$PAIR_OUT/wasm-bindgen-install.log" --receipt "$PAIR_OUT/wasm-bindgen-install-command.json" -- cargo +1.90.0 install wasm-bindgen-cli --version 0.2.105 --locked
          python "$Q/run_macos_pair_0457.py" --phase tools --target aarch64-apple-darwin --product-root "$GITHUB_WORKSPACE/product" --out "$PAIR_OUT"
      - name: One bounded cold product R wheel build
        run: python controller/scripts/release/run_macos_pair_0457.py --phase build --target aarch64-apple-darwin --product-root "$GITHUB_WORKSPACE/product" --out "$PAIR_OUT"
      - name: Exact installed product R temporal routing and SDK42 controls
        run: python controller/scripts/release/run_macos_pair_0457.py --phase sdk --target aarch64-apple-darwin --product-root "$GITHUB_WORKSPACE/product" --out "$PAIR_OUT"
      - name: Retain SDK component immediately before parity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partial-pair-sdk-macos-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mac-pair/evidence
          if-no-files-found: warn
      - name: Preserve all nine original refusal parity gates
        run: |
          set -euo pipefail
          python controller/scripts/release/run_macos_pair_0457.py --phase vectors --target aarch64-apple-darwin --product-root "$GITHUB_WORKSPACE/product" --out "$PAIR_OUT"
          python controller/scripts/release/run_macos_pair_0457.py --phase wasm-tools --target aarch64-apple-darwin --product-root "$GITHUB_WORKSPACE/product" --out "$PAIR_OUT"
          python controller/scripts/release/run_macos_pair_0457.py --phase parity --target aarch64-apple-darwin --product-root "$GITHUB_WORKSPACE/product" --out "$PAIR_OUT"
          python controller/scripts/release/run_macos_pair_0457.py --phase finalize --target aarch64-apple-darwin --product-root "$GITHUB_WORKSPACE/product" --out "$PAIR_OUT"
      - name: Prepare original bounded artifact retention
        if: always()
        run: python controller/scripts/release/run_macos_pair_0457.py --phase retain --target aarch64-apple-darwin --product-root "$GITHUB_WORKSPACE/product" --out "$PAIR_OUT"
      - name: Retain exact pair qualification and partials
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ job.status == 'success' && format('weft-pair-aarch64-apple-darwin-c623b94b66b0b46d492d457c62faddc896e2e452-{0}-{1}-attempt-{2}', github.sha, github.run_id, github.run_attempt) || format('failed-weft-pair-macos-{0}-{1}-attempt-{2}', github.sha, github.run_id, github.run_attempt) }}
          path: ${{ runner.temp }}/mac-pair/upload
          if-no-files-found: error
          retention-days: 90
