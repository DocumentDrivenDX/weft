name: Compiler conformance

on:
  workflow_dispatch:
    inputs:
      temporal_selected_candidate:
        description: Explicit reviewed Linux 0.4.57 and WASM component selection
        type: boolean
        default: false
      expected_control_sha:
        description: Exact Sol-reviewed workflow/control commit; required for selection
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.temporal_selected_candidate }}

jobs:
  compiler-and-evidence:
    if: ${{ !inputs.temporal_selected_candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install pinned Rust and host builders
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default 1.90.0
          python -m pip install maturin==1.9.6
          cargo fetch --locked
      - name: Install actual Chromium and system dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/configure_ubuntu_apt_sources.py --self-test
          sudo python3 .github/scripts/configure_ubuntu_apt_sources.py --apply
          sudo tee /etc/apt/apt.conf.d/zz-weft-network-bounds >/dev/null <<'APT'
          Acquire::Retries "2";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APT
          apt_config="$(sudo apt-config dump)"
          grep -Fqx 'Acquire::Retries "2";' <<<"$apt_config"
          grep -Fqx 'Acquire::http::Timeout "20";' <<<"$apt_config"
          grep -Fqx 'Acquire::https::Timeout "20";' <<<"$apt_config"
          printf '%s\n' "$apt_config" | grep -E '^Acquire::(Retries|http::Timeout|https::Timeout) '
          sudo timeout --signal=TERM --kill-after=30s 5m apt-get update
          playwright_dir="$RUNNER_TEMP/playwright"
          timeout --kill-after=30s 5m npm install --prefix "$playwright_dir" --ignore-scripts --no-package-lock playwright@1.62.1
          timeout --kill-after=30s 15m node "$playwright_dir/node_modules/playwright/cli.js" install --with-deps chromium
          WEFT_PLAYWRIGHT_MODULE="$playwright_dir/node_modules/playwright/index.mjs" \
            timeout --kill-after=10s 60s node --input-type=module -e '
              import { pathToFileURL } from "node:url";
              const { chromium } = await import(pathToFileURL(process.env.WEFT_PLAYWRIGHT_MODULE));
              const browser = await chromium.launch({ headless: true });
              console.log(`Launched pinned Chromium at ${chromium.executablePath()}`);
              await browser.close();
            '
      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Validate governed specifications
        run: |
          bun run specs:check
          bun tests/compile/schema-v0.4-check.ts
          bun tests/two-hop-schemas/check.ts
      - name: Check distribution metadata boundaries
        run: |
          bun test tests/distribution-manifest/schema.test.ts
          bun test tests/distribution-index/schema.test.ts
          bun test tests/specification-scope/checker.test.ts
          python3 -m unittest discover -s tests/distribution-source-metadata -q
          python3 -m unittest discover -s tests/distribution-assembly -q
          python3 -S -W error::ResourceWarning -m unittest discover -s scripts/distribution -p test_paths_assembly.py -q
          python3 -S -W error::ResourceWarning -m unittest discover -s tests/distribution-paths-assembly -q
          python3 -S -W error::ResourceWarning -m unittest discover -s tests/distribution-paths-corpus -q
          python3 -S -W error::ResourceWarning -m unittest discover -s tests/distribution-count-star-corpus -q
          python3 -S -W error::ResourceWarning -m unittest discover -s tests/distribution-count-star-boundaries -q
          python3 -S -W error::ResourceWarning -m unittest discover -s tests/distribution-count-star-assembly -q
          python3 -I -B -S -W error::ResourceWarning -m unittest discover -s tests/distribution-implicit-arithmetic-corpus -q
          python3 -S -B -m unittest discover -s scripts/release -p test_selected_assets_0454.py -q
      - name: Enforce module boundaries and negative controls
        run: WEFT_CARGO="$(command -v cargo)" bun run modules:check
      - name: Install pinned browser binding builder
        run: cargo install wasm-bindgen-cli --version 0.2.105 --locked
      - name: Install pinned host diagnostics dependencies
        run: python -m pip install -r scripts/reliability/requirements.txt
      - name: Actual SDK diagnostics, receiver and failure controls
        run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts/reliability -p test_diagnostics.py -v
          PYTHONPATH=scripts python -O -m unittest discover -s scripts/reliability -p test_diagnostics.py -v
      - name: Runner configuration and fail-closed controls
        run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts/reliability -p test_config.py -v
          PYTHONPATH=scripts python -O -m unittest discover -s scripts/reliability -p test_config.py -v
      - name: Configured optimized source mutation qualification
        run: >-
          python -O tests/qualify-and-evolve/source-mutations.py
          --cargo "$(command -v cargo)"
          --rustup-home "$(rustup show home)"
          --cargo-home "$(dirname "$(dirname "$(command -v cargo)")")"
          --temp-root "$RUNNER_TEMP/weft-mutations"
          --output-root "$RUNNER_TEMP/weft-mutation-evidence"
      - name: Formal controls and actual Rust correspondence
        run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts/reliability -p test_formal.py -v
          PYTHONPATH=scripts python -O -m unittest discover -s scripts/reliability -p test_formal.py -v
          python scripts/reliability/gate.py --cargo "$(command -v cargo)" --rustup-home "$(rustup show home)" --cargo-home "$(dirname "$(dirname "$(command -v cargo)")")" --temp-root "$RUNNER_TEMP/weft-formal" --output-root "$RUNNER_TEMP/weft-formal-evidence"
      - name: Build browser ESM and declarations
        run: bun run browser:build
      - name: Candidate Rust workspace conformance
        run: cargo test --workspace --features weft-runtime/truss-postgresql-candidate,weft-runtime/ashlar-databricks-candidate,weft-runtime/test-original,weft-runtime/test-third,weft-postgresql/conformance-original --locked
      - name: Qualified Rust workspace conformance
        run: cargo test --workspace --features weft-runtime/truss-postgresql-qualified,weft-runtime/ashlar-databricks-qualified,weft-runtime/test-original,weft-runtime/test-third,weft-postgresql/conformance-original --locked
      - name: Test explicit implicit arithmetic profile and CLI transport
        run: cargo test --locked -j1 -p weft-runtime --no-default-features --features ashlar-databricks-paths-keys,ashlar-databricks-implicit-arithmetic
      - name: Enforce Cargo module boundaries
        run: |
          python3 scripts/checks/check-module-boundaries.py
          python3 tests/module-boundaries/check.py
      - name: Build explicit distinct-count runtime
        run: cargo build -p weft-runtime --features ashlar-databricks-count-distinct --locked
      - name: Build explicit optional count HAVING composition
        run: cargo build -p weft-runtime --features ashlar-databricks-count-having --locked
      - name: Build explicit LEFT JOIN runtime
        run: cargo build -p weft-runtime --features ashlar-databricks-left-join --locked
      - name: Test explicit path runtime namespace
        run: cargo test -p weft-runtime --features ashlar-databricks-paths paths::tests --locked
      - name: Test explicit path CLI transport
        run: cargo test -p weft-runtime --features ashlar-databricks-paths --bin weft-paths --test paths_cli --locked
      - name: Test separate required-root keys and unchanged paths registrations
        run: cargo test -p weft-runtime --no-default-features --features ashlar-databricks-paths-keys,ashlar-databricks-paths --lib paths --locked
      - name: Test related-key private name ownership
        run: cargo test -p weft-databricks --lib related_keys::tests --locked
      - name: Test separate paths-keys CLI transport
        run: cargo test -p weft-runtime --no-default-features --features ashlar-databricks-paths-keys --bin weft-paths-keys --test paths_keys_cli --locked
      - name: Test versioned grouped row-count HAVING
        run: cargo test -p weft-runtime --no-default-features --features ashlar-databricks-paths-keys --test paths_keys_having --locked
      - name: Refuse conflicting runtime registrations
        shell: bash
        run: |
          for backend in truss-postgresql ashlar-databricks; do
            if cargo check -p weft-runtime --features "${backend}-candidate,${backend}-qualified" --locked > conflict.log 2>&1; then
              cat conflict.log
              exit 1
            fi
            cat conflict.log
            grep -F 'Choose either candidate or qualified registration for each backend' conflict.log
          done
          if cargo check -p weft-runtime --features ashlar-databricks-count-having,ashlar-databricks-count-distinct --locked > conflict.log 2>&1; then
            cat conflict.log
            exit 1
          fi
          cat conflict.log
          grep -F 'Choose either candidate or qualified registration for each backend' conflict.log
          if cargo check -p weft-runtime --features ashlar-databricks-count-distinct,ashlar-databricks-arithmetic --locked > conflict.log 2>&1; then
            cat conflict.log
            exit 1
          fi
          cat conflict.log
          grep -F 'Choose either candidate or qualified registration for each backend' conflict.log
          for prior in candidate qualified arithmetic mathematical-integer count-distinct count-having; do
            if cargo check -p weft-runtime --features "ashlar-databricks-left-join,ashlar-databricks-${prior}" --locked > conflict.log 2>&1; then
              cat conflict.log
              exit 1
            fi
            cat conflict.log
            grep -F 'Choose either candidate or qualified registration for each backend' conflict.log
          done
      - name: Replay retained evidence and corruption controls
        run: |
          python -m unittest discover -s tests/qualify-and-evolve -p test_licensed_source.py -v
          python -m unittest discover -s tests/qualify-and-evolve -p test_retained_output.py -v
          python tests/qualify-and-evolve/check-retained-evidence.py
      - name: Current input closure and stale controls
        run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts/reliability -p test_custody.py -v
          PYTHONPATH=scripts python -O -m unittest discover -s scripts/reliability -p test_custody.py -v
          PYTHONPATH=scripts python -m unittest discover -s scripts/reliability -p test_fresh_hosts.py -v
          PYTHONPATH=scripts python -O -m unittest discover -s scripts/reliability -p test_fresh_hosts.py -v
      - name: Fresh CLI, installed native wheel and real Chromium WASM parity
        run: >-
          python scripts/reliability/fresh_hosts.py
          --cargo "$(command -v cargo)"
          --rustup-home "$(rustup show home)"
          --cargo-home "$(dirname "$(dirname "$(command -v cargo)")")"
          --temp-root "$RUNNER_TEMP/weft-fresh-hosts"
          --output-root "$RUNNER_TEMP/weft-fresh-host-evidence"
          --bun "$(command -v bun)"
          --maturin "$(command -v maturin)"
          --wasm-bindgen "$(command -v wasm-bindgen)"
      - name: Retain current qualification receipts and fresh artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-qualification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/weft-fresh-host-evidence
            ${{ runner.temp }}/weft-fresh-hosts/fresh-host-evidence
            ${{ runner.temp }}/weft-formal-evidence
            ${{ runner.temp }}/weft-mutation-evidence
          if-no-files-found: error

  graph-requirements-candidate:
    if: ${{ !inputs.temporal_selected_candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Select the installed minimal compiler without auto-installing unrelated
      # rust-toolchain.toml rustfmt/WASM components in this host-only job.
      RUSTUP_TOOLCHAIN: "1.90.0"
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Graph candidate builders
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          python -m pip install maturin==1.9.6
          cargo fetch --locked
      - name: Original Graph Core, lifetime and runtime custody checks
        run: |
          cargo test --locked -p weft-core --features current-presence-graph-requirements-candidate --lib
          cargo test --locked -p weft-core --features current-presence-graph-requirements-candidate --doc current_presence_graph_requirements
          cargo test --locked -p weft-runtime --features current-presence-graph-requirements-candidate --lib current_presence
      - name: Build separate default, model-only and Graph native wheels
        run: |
          maturin build --locked --profile dev --manifest-path crates/weft-python/Cargo.toml --no-default-features --features pyo3/extension-module --out "$RUNNER_TEMP/graph-wheels/default"
          maturin build --locked --profile dev --manifest-path crates/weft-python/Cargo.toml --no-default-features --features current-presence-model-requirements-candidate --out "$RUNNER_TEMP/graph-wheels/model"
          maturin build --locked --profile dev --manifest-path crates/weft-python/Cargo.toml --no-default-features --features current-presence-graph-requirements-candidate --out "$RUNNER_TEMP/graph-wheels/graph"
      - name: Actual native Python custody and feature isolation
        run: |
          mkdir -p "$RUNNER_TEMP/graph-evidence"
          for profile in default model graph; do
            python -m pip install --no-deps --target "$RUNNER_TEMP/graph-installed/$profile" "$RUNNER_TEMP/graph-wheels/$profile/"*.whl
          done
          python tests/current-query-presence/python-graph-requirements-bridge.py "$RUNNER_TEMP/graph-installed/default" default > "$RUNNER_TEMP/graph-evidence/default.json"
          python tests/current-query-presence/python-graph-requirements-bridge.py "$RUNNER_TEMP/graph-installed/model" old-model > "$RUNNER_TEMP/graph-evidence/model.json"
          python tests/current-query-presence/python-graph-requirements-bridge.py "$RUNNER_TEMP/graph-installed/graph" graph > "$RUNNER_TEMP/graph-evidence/graph.json"
          python tests/current-query-presence/python-model-requirements-bridge.py "$RUNNER_TEMP/graph-installed/graph" candidate "$RUNNER_TEMP/graph-evidence/existing-model.json"
      - name: Retain unpublished Graph candidate wheels and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-requirements-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/graph-evidence
            ${{ runner.temp }}/graph-wheels
          if-no-files-found: warn

  temporal-selected-linux:
    if: ${{ inputs.temporal_selected_candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '1'
      RUSTUP_TOOLCHAIN: '1.90.0'
      EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
    steps:
      - name: Set isolated hosted Cargo paths
        shell: bash
        run: |
          printf 'CARGO_HOME=%s/temporal-cargo\nCARGO_TARGET_DIR=%s/temporal-target\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout reviewed workflow controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
      - name: Checkout frozen artifact source separately
        uses: actions/checkout@v4
        with:
          ref: d52644f4b2fb5579f9a303012cfc3a98ac6c174e
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed on source, lock, resources and reviewed control identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_CONTROL_SHA"
          test "$(git -C controls rev-parse HEAD)" = "$EXPECTED_CONTROL_SHA"
          test "$GITHUB_REPOSITORY" = DocumentDrivenDX/weft
          if git -C source config --get-regexp '^url\..*\.insteadof$'; then
            echo 'Git URL rewrite refused' >&2; exit 1
          else
            test "$?" = 1
          fi
          python controls/.github/scripts/temporal-selected-0457.py source controls/.github/scripts/temporal-selected-0457 "$RUNNER_TEMP/temporal-evidence" --preflight
      - name: Produce only Linux x86_64 manylinux2014 wheel
        uses: PyO3/maturin-action@v1
        env:
          CARGO_TARGET_DIR: target
        with:
          maturin-version: '1.9.6'
          rust-toolchain: '1.90.0'
          target: x86_64-unknown-linux-gnu
          manylinux: '2014'
          working-directory: source
          before-script-linux: |
            set -eu
            mkdir -p dist/selected-0457
            cargo --version --verbose > dist/selected-0457/container-cargo.txt
            rustc --version --verbose > dist/selected-0457/container-rust.txt
            cargo metadata --locked --format-version 1 --manifest-path crates/weft-python/Cargo.toml --filter-platform x86_64-unknown-linux-gnu --features ashlar-sdk-ordered-page-candidate,raw-postgresql-reads,ashlar-databricks-paths-keys,ashlar-databricks-qualified,truss-postgresql-pg18,current-postgresql-scalar-candidate,current-databricks-scalar-candidate,current-query-refinement-candidate,current-presence-graph-requirements-candidate > dist/selected-0457/container-wheel-metadata.json
            cargo tree --locked -p weft-python --target x86_64-unknown-linux-gnu --features ashlar-sdk-ordered-page-candidate,raw-postgresql-reads,ashlar-databricks-paths-keys,ashlar-databricks-qualified,truss-postgresql-pg18,current-postgresql-scalar-candidate,current-databricks-scalar-candidate,current-query-refinement-candidate,current-presence-graph-requirements-candidate --edges normal,build,features --invert serde_json@1.0.145 --no-dedupe --format '{p} features=[{f}]' > dist/selected-0457/container-wheel-features.txt
          args: --manifest-path crates/weft-python/Cargo.toml --release --locked --out dist/selected-0457
      - name: Retain the genuine container-built wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/temporal-evidence/wheels"
          cp source/dist/selected-0457/* "$RUNNER_TEMP/temporal-evidence/wheels/"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Prepare pinned WASM and actual Chromium builders
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
          cargo install --locked --version 0.2.105 wasm-bindgen-cli
          bun install --frozen-lockfile
          python3 .github/scripts/configure_ubuntu_apt_sources.py --self-test
          sudo python3 .github/scripts/configure_ubuntu_apt_sources.py --apply
          sudo timeout --signal=TERM --kill-after=30s 5m apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          timeout --kill-after=30s 15m bun x playwright install --with-deps chromium
          {
            rustc --version --verbose
            cargo --version --verbose
            wasm-bindgen --version
            bun --version
            node --version
          } | tee "$RUNNER_TEMP/temporal-evidence/host-builder-versions.txt"
      - name: Installed Linux controls, full-feature WASM, Node and real Chromium
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          python controls/.github/scripts/temporal-selected-0457.py source controls/.github/scripts/temporal-selected-0457 "$RUNNER_TEMP/temporal-evidence"
      - name: Preserve all actual outputs including failure or timeout evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: temporal-selected-linux-wasm-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/temporal-evidence
            ${{ runner.temp }}/temporal-target/wasm32-unknown-unknown/release/weft_wasm.wasm
          if-no-files-found: error
          retention-days: 90
