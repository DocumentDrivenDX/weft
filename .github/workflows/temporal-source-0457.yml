name: Current Weft source and temporal WASM 0.4.57
on:
  workflow_dispatch:
    inputs:
      prepare_current:
        type: boolean
        default: false
        description: Explicit reviewed final-main-R source/archive and temporal-WASM admission
      source_sha:
        type: string
        required: true
        description: Actual frozen final main R, never a candidate or controller guess
permissions:
  contents: read
concurrency:
  group: current-source-0457-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  source-archives:
    if: inputs.prepare_current
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CARGO_BUILD_JOBS: '1'
      RUSTUP_TOOLCHAIN: '1.90.0'
    steps:
      - name: Initialize retained phase state
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/current-source" "$RUNNER_TEMP/current-wasm"
          printf '{"status":"incomplete","sourceCommit":"%s","workflowCommit":"%s"}\n' "$SOURCE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/current-source/phase.json"
          printf 'CARGO_HOME=%s/current-cargo\nCARGO_TARGET_DIR=%s/current-target\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Exact-main R, canonical S, lock and resource admission
        run: python scripts/release/verify_current_inputs_0457.py > "$RUNNER_TEMP/current-source/preflight.json"
      - name: Pinned source-only tools
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
          python -m pip install maturin==1.9.6
      - name: Produce and verify actual R source archives before final wheel admission
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          python scripts/release/prepare_current_sources_0457.py --out "$RUNNER_TEMP/current-source"
      - name: Retain source archives and correspondence immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ job.status == 'success' && format('current-source-0457-{0}-{1}-attempt-{2}', github.sha, github.run_id, github.run_attempt) || format('failed-current-source-0457-{0}-{1}-attempt-{2}', github.sha, github.run_id, github.run_attempt) }}
          path: |
            ${{ runner.temp }}/current-source
            !${{ runner.temp }}/current-source/checked-sdist/**
          if-no-files-found: error
          retention-days: 90

  temporal-wasm:
    needs: source-archives
    if: inputs.prepare_current
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CARGO_BUILD_JOBS: '1'
      RUSTUP_TOOLCHAIN: '1.90.0'
    steps:
      - name: Initialize retained WASM phase state
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/current-wasm"
          printf '{"status":"incomplete","sourceCommit":"%s","workflowCommit":"%s"}\n' "$SOURCE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/current-wasm/phase.json"
          printf 'CARGO_HOME=%s/current-cargo\nCARGO_TARGET_DIR=%s/current-target\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Exact-main R input admission before tools
        run: python scripts/release/verify_current_inputs_0457.py > "$RUNNER_TEMP/current-wasm/preflight.json"
      - name: Pinned WASM builders
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
          python -m pip install maturin==1.9.6
          cargo install --locked --version 0.2.105 wasm-bindgen-cli
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pinned browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          python3 .github/scripts/configure_ubuntu_apt_sources.py --self-test
          sudo python3 .github/scripts/configure_ubuntu_apt_sources.py --apply
          sudo timeout --signal=TERM --kill-after=30s 5m apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          timeout --kill-after=30s 15m bun x playwright install --with-deps chromium
      - name: Build corrected raw-temporal WASM and execute Node and real Chromium
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          python scripts/release/qualify_current_wasm_0457.py --out "$RUNNER_TEMP/current-wasm"
      - name: Retain all temporal compiler outputs on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ job.status == 'success' && format('current-temporal-wasm-0457-{0}-{1}-attempt-{2}', github.sha, github.run_id, github.run_attempt) || format('failed-current-temporal-wasm-0457-{0}-{1}-attempt-{2}', github.sha, github.run_id, github.run_attempt) }}
          path: ${{ runner.temp }}/current-wasm
          if-no-files-found: warn
          retention-days: 90
