name: Weft main aggregate source qualification

on:
  push:
    branches:
      - codex/weft-main-aggregate-qualification

permissions:
  contents: read

concurrency:
  group: weft-main-aggregate-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-sum-avg:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/weft-main-aggregate-qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # approved UMF checkout action pin
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install the repository Rust toolchain without optional components
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal --no-self-update
          rustup run 1.90.0 rustc --version --verbose
          rustup run 1.90.0 cargo --version --verbose

      - name: Capture and verify source, toolchain, event, and job identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/weft-sum-avg-evidence/logs"
          evidence="$RUNNER_TEMP/weft-sum-avg-evidence"
          {
            printf 'format\tweft.sum-avg-hosted-receipt/1\n'
            printf 'event_name\t%s\n' "$GITHUB_EVENT_NAME"
            printf 'ref\t%s\n' "$GITHUB_REF"
            printf 'sha\t%s\n' "$GITHUB_SHA"
            printf 'workflow\t%s\n' "$GITHUB_WORKFLOW"
            printf 'job\t%s\n' "$GITHUB_JOB"
            printf 'run_id\t%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt\t%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'runner_os\t%s\n' "$RUNNER_OS"
            printf 'runner_arch\t%s\n' "$RUNNER_ARCH"
            printf 'image_os\t%s\n' "${ImageOS:-unknown}"
            printf 'image_version\t%s\n' "${ImageVersion:-unknown}"
            printf 'commit\t%s\n' "$(git rev-parse HEAD)"
            printf 'tree\t%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'workflow_file\t.github/workflows/weft-sum-avg-qualification.yml\n'
            printf 'toolchain_channel\t1.90.0\n'
            printf 'rustc_version_begin\n'
            rustup run 1.90.0 rustc --version --verbose
            printf 'cargo_version_begin\n'
            rustup run 1.90.0 cargo --version --verbose
            printf 'rustc_path\t%s\n' "$(rustup which rustc --toolchain 1.90.0)"
            printf 'cargo_path\t%s\n' "$(rustup which cargo --toolchain 1.90.0)"
            sha256sum "$(rustup which rustc --toolchain 1.90.0)" "$(rustup which cargo --toolchain 1.90.0)"
          } > "$evidence/receipt.tsv"

          cat > "$evidence/expected-source.sha256" <<'PINS'
          9127d4f5d2b9efcf5627045a2f815ca7a42569cfbc35e15b429fb74b3952beeb  crates/weft-core/src/raw_read.rs
          753ac19eade3839a2ece49c2cd933ac40ed3d72beba922b2c47d32fac8bea791  crates/weft-core/src/table_lifecycle.rs
          3cb53096548c7210021e6bd948880248a04c81704b221e3239460576b3559b6c  crates/weft-core/src/table_operation/values.rs
          9cd4cb3c193d22d9db46cfddb0e86b9214476377fb798eec494fb80769c23dec  crates/weft-databricks/src/raw_read.rs
          51be3621e05f0f90a301310eb28380dc454bc6b0be0b05763025cc39adbb10ca  crates/weft-databricks/src/unity_current_predicate.rs
          167eaf5f10b3d5b6d25e829b927e35134f86ad55ca1a6465d45710ce54e2aa9b  crates/weft-databricks/src/unity_current_summary.rs
          f51d486f9aea9f6003c8956b628ecf19f1800dcf62dda287794fe46cbb0b9d39  crates/weft-databricks/src/unity_current_summary_lowering.rs
          9892eb36097aefa5c5583e4b2ddb68a5d09a934f32d9da9f7643684b63371a9e  crates/weft-databricks/src/unity_current_sum.rs
          ab3589763d0cf564067c9a7fe65cdf107b8da920bf69819176270434433c4696  crates/weft-databricks/src/unity_current_sum_lowering.rs
          73a9d2886c469e8c02423af2da898f0126c2cf006063bcfbf0d22ba22bafed57  crates/weft-databricks/src/unity_current_avg.rs
          929e087cf0cd8b2b3a1df672a5429e6fa604184e5277c1a440deb128cfdddca6  crates/weft-databricks/src/unity_current_avg_lowering.rs
          1124fc19fb6ae7f20b4bd1db3622940db071c5cdfd717f32ecc0f1ab4e8af803  crates/weft-databricks/src/unity_current_read.rs
          ae2b4cd7402572ff112aaef1ea081447305204e7330096ec0f5f8141267ffefd  crates/weft-databricks/src/lib.rs
          c77e339db207d859adf20dfaca3044ead8d16a12898529f1a3ef171345372c81  crates/weft-databricks/tests/fixtures/original-unity-model.json
          979e823b0d4855efcdd83c583fe0bc698f734efb093e6ad1a695fc80c5572234  crates/weft-databricks/tests/fixtures/original-unity-binding.json
          b1af07e2e34e78954097340add6518dfd847b232881f89c6209015023f8c5346  crates/weft-databricks/src/raw_pages.rs
          b245af2a47a26128b04f98304855769b4d403ab2e4f10bc3f615134f5df385c2  crates/weft-runtime/src/lib.rs
          5257cbd395c7d3ed86c5d8645068599f6d6368c75eca75526cd4978ee148140d  tests/current-unity-aggregate/python-bridge.py
          e1b7424f1a3524b54d42e73480729f82047733c4203416e02862c89b40220c6d  tests/current-unity-aggregate/browser-bridge.ts
          601e08d3f41c1a68c4a892ad62aae869b233161d51305d996137c9eb56ac62b1  tests/spark-pages/read-request.json
          1beb63e03c52a6787e3cc83500d10f3be67b322ca1b6a0c51615abd2aca2385f  crates/weft-core/src/model.rs
          fa273b06106fe939e86614712ecc88a2bb0ab8a4de0252df079baef38c280f89  crates/weft-postgresql/src/query_wire.rs
          e1f0115e8a8ca85ac19d0667d94182523afe313ea153a9743b46f13ad260995d  crates/weft-postgresql/src/raw_action.rs
          4ce8ee91f9a8a9166ab574c467394713be159ba188166c437463d322ea2de97f  crates/weft-postgresql/src/raw_bulk.rs
          81f8cf605859f2dc679a9149787bd9a63cfc057db71d11660f119157538da6ce  crates/weft-postgresql/src/raw_read.rs
          0d7c9226eb5dc944ca2e41c3001661d607631a380ba291444ea7a3a1d0070dbe  crates/weft-postgresql/src/search.rs
          8c8058eadcb33639fd5e8c5f17aeef728e4d409644b825046cfd5d3e01bb9a2d  crates/weft-postgresql/src/table_operation.rs
          9b88059cc93b3cebce57fe6a774864f3ea203e6d7c3d7bf05695f20f4c6f10b5  crates/weft-postgresql/src/table_operation/insert_batch.rs
          537533d0aacd25a1a8c086a58d87fe64df8253994ef18df429bfbd9c043cd21c  crates/weft-postgresql/src/table_seed.rs
          429a1e2e44c54cb5bf41229b1f7ee19ec8d6e11db9a8e035791d4dc3f198a6fe  crates/weft-postgresql/tests/table_operation.rs
          6bf66b4f918d97a2cc85c7e67a16344cb59ee5180aa2a4af3cf4e04a3c26ca7f  crates/weft-postgresql/Cargo.toml
          c665649cd622f7422c96241231db69e454de4b5c69adfe4ddfb62576fea01928  Cargo.toml
          9cda30f094e5154ba794a2a24d0112335426b93474f8bc727daef3d69a72db4b  crates/weft-core/Cargo.toml
          5c2cadb3ec0fcb43a81f286cdc44fcad46b5812a3ef5aa22edc78023224f24bf  crates/weft-databricks/Cargo.toml
          e47b1c22260d5e4a6057f67261bf5fbea5a7abf406b6af44cd9e4109c96d5223  crates/weft-runtime/Cargo.toml
          6bf66b4f918d97a2cc85c7e67a16344cb59ee5180aa2a4af3cf4e04a3c26ca7f  crates/weft-postgresql/Cargo.toml
          3cb8b829c278dd7499d438d324ad16a1d7d8c017ab90ba862c2626894634e743  crates/weft-python/pyproject.toml
          dd298ffebe59145c32001482842b239b21aa15c61af7fbe6b06995beceda3239  crates/weft-python/Cargo.toml
          a260125cf02bfa850aded88545508e8fa41462f557bb79eda6faa0e61284445a  crates/weft-wasm/Cargo.toml
          04d786f9adb2f3cdaf03f38d3106cbd6bc2ad7e13f4eaea458a10988518ae103  crates/weft-wasm/src/lib.rs
          PINS
          sha256sum -c "$evidence/expected-source.sha256" > "$evidence/source-check.txt"
          printf '%s  Cargo.lock\n' a44853f6a873d724f38c38f933f69ada23384974bb2bc1207d048e25d03349a9 > "$evidence/expected-lock.sha256"
          sha256sum -c "$evidence/expected-lock.sha256" >> "$evidence/source-check.txt"
          printf '%s  rust-toolchain.toml\n' 41ffa816f9f3929eee58730344f11d341b50fb15ac1f3850a7b9ff4205831e14 > "$evidence/expected-toolchain.sha256"
          sha256sum -c "$evidence/expected-toolchain.sha256" >> "$evidence/source-check.txt"
          sha256sum .github/workflows/weft-sum-avg-qualification.yml >> "$evidence/source-check.txt"
          cat "$evidence/source-check.txt" >> "$evidence/receipt.tsv"

      - name: Check selected Rust crates (10 minute aggregate bound)
        id: cargo-gate
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/weft-sum-avg-evidence"
          deadline=$(( $(date +%s) + 600 ))
          failed=0
          run_one() {
            local name="$1" expected_tests="$2"; shift 2
            local started ended remaining limit code cargo_code log begin elapsed passed
            started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            begin=$SECONDS
            remaining=$(( deadline - $(date +%s) ))
            limit=$(( remaining - 10 ))
            if (( limit <= 0 )); then
              printf 'command\t%s\t%s\t%s\tduration_s=0\tlimit_s=0\tcargo_exit=not-started\tgate_exit=124\trefused=termination-grace-reserved\n' "$name" "$started" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$evidence/commands.tsv"
              failed=1
              return
            fi
            (( limit > 240 )) && limit=240
            log="$evidence/logs/$name.log"
            set +e
            timeout --signal=TERM --kill-after=10s "${limit}s" rustup run 1.90.0 cargo "$@" >"$log" 2>&1
            cargo_code=$?
            code=$cargo_code
            set -e
            if (( expected_tests == 1 && cargo_code == 0 )); then
              passed=$(sed -nE 's/^test result: ok\. ([0-9]+) passed;.*/\1/p' "$log" | awk '{ total += $1 } END { print total + 0 }')
              if (( passed == 0 )); then
                code=125
                printf 'nonzero_test_count_required\t%s\tobserved=%s\n' "$name" "$passed" >> "$evidence/receipt.tsv"
              fi
            else
              passed=not-applicable
            fi
            ended=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            elapsed=$(( SECONDS - begin ))
            printf 'command\t%s\t%s\t%s\tduration_s=%s\tlimit_s=%s\tcargo_exit=%s\tgate_exit=%s\ttests_passed=%s\targv=cargo %s\n' "$name" "$started" "$ended" "$elapsed" "$limit" "$cargo_code" "$code" "$passed" "$*" >> "$evidence/commands.tsv"
            if (( $(wc -c < "$log") > 1048576 )); then
              tail -c 1048576 "$log" > "$log.bounded"
              mv "$log.bounded" "$log"
              printf 'log_truncated_to_1MiB\t%s\n' "$name" >> "$evidence/receipt.tsv"
            fi
            printf '\n== %s (exit %s) ==\n' "$name" "$code"
            tail -n 80 "$log"
            (( code == 0 )) || failed=1
          }
          : > "$evidence/commands.tsv"
          run_one compile-tests 0 check --locked --tests -p weft-core -p weft-databricks -p weft-runtime -p weft-postgresql --features weft-runtime/raw-postgresql-reads
          run_one focused-core-read 1 test --locked --lib -p weft-core raw_read::
          run_one focused-dispatch 1 test --locked --lib -p weft-databricks unity_current_read::
          run_one focused-sum 1 test --locked --lib -p weft-databricks unity_current_sum
          run_one focused-avg 1 test --locked --lib -p weft-databricks unity_current_avg
          run_one focused-backend-public-route 1 test --locked --lib -p weft-databricks raw_read::tests::current_sum_and_avg_keep_closed_requests_and_route_by_version
          run_one focused-runtime-public-route 1 test --locked --lib -p weft-runtime --features raw-postgresql-reads current_unity_raw_dispatch_tests::
          run_one focused-pg-local-wire 1 test --locked --lib -p weft-postgresql query_wire::tests::local_timestamp_wire_projection_stays_distinct_from_instant_and_preserves_null_input
          run_one focused-predicate-quoting 1 test --locked --lib -p weft-databricks unity_current_predicate::
          run_one g02-closed-ast 1 test --locked -p weft-postgresql --test table_operation g02_row_expression_compiles_closed_ast_with_private_full_effects_guard
          run_one g02-predicate-literals 1 test --locked -p weft-postgresql --test table_operation g02_predicate_literals_obey_source_field_nullability_and_refinements
          run_one g02-predicate-numeric-literals 1 test --locked -p weft-postgresql --test table_operation g02_predicate_numeric_literals_obey_wrappers_ranges_enums_and_native_width
          run_one g02-numeric-conditional-algebra 1 test --locked -p weft-postgresql --test table_operation g02_numeric_and_conditional_algebra_uses_unconstrained_qualified_intermediates
          run_one g02-intrinsic-null-types 1 test --locked -p weft-postgresql --test table_operation g02_intrinsic_null_types_and_null_safe_comparisons_remain_closed
          cat "$evidence/commands.tsv" >> "$evidence/receipt.tsv"
          if (( failed != 0 )); then exit 1; fi

      - name: Enforce public artifact bound and retain receipt/logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/weft-sum-avg-evidence"
          if [ ! -d "$evidence" ]; then
            mkdir -p "$evidence/logs"
            printf 'receipt_unavailable\tprior_step_failed_before_capture\n' > "$evidence/receipt.tsv"
          fi
          while IFS= read -r -d '' file; do
            size=$(wc -c < "$file")
            if (( size > 1048576 )); then
              tail -c 1048576 "$file" > "$file.bounded"
              mv "$file.bounded" "$file"
            fi
          done < <(find "$evidence" -type f -print0)
          total=$(du -sk "$evidence" | awk '{print $1}')
          if (( total > 8192 )); then
            printf 'artifact_bound_exceeded_kib\t%s\n' "$total" >> "$evidence/receipt.tsv"
            exit 1
          fi

      - name: Upload public source receipt and bounded Cargo logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4.6.2
        with:
          name: weft-sum-avg-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weft-sum-avg-evidence/
          if-no-files-found: error
          retention-days: 14

  host-parity:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/weft-main-aggregate-qualification'
    needs: rust-sum-avg
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # approved UMF checkout action pin
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Initialize host-parity paths
        if: always()
        shell: bash
        run: |
          printf 'PARITY_ROOT=%s\n' "$RUNNER_TEMP/weft-host-parity" >> "$GITHUB_ENV"
          printf 'PARITY_DEADLINE_FILE=%s\n' "$RUNNER_TEMP/weft-host-parity-deadline" >> "$GITHUB_ENV"

      - name: Fail-closed source preflight and start monotonic deadline
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PARITY_ROOT/evidence/logs" "$RUNNER_TEMP/weft-parity-tools"
          mono=$(awk '{print $1}' /proc/uptime)
          awk -v n="$mono" 'BEGIN {printf "%.2f\n", n+1200}' > "$PARITY_DEADLINE_FILE"
          awk -v n="$mono" 'BEGIN {printf "%.2f\n", n+420}' > "$RUNNER_TEMP/weft-parity-bootstrap-deadline"
          awk -v n="$mono" 'BEGIN {printf "%.2f\n", n+720}' > "$RUNNER_TEMP/weft-parity-wheel-deadline"
          awk -v n="$mono" 'BEGIN {printf "%.2f\n", n+1080}' > "$RUNNER_TEMP/weft-parity-wasm-deadline"
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/codex/weft-main-aggregate-qualification
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test -n "$(git rev-parse 'HEAD^{tree}')"
          test "$(grep -F 'maturin==1.9.6' crates/weft-python/pyproject.toml)" = 'requires=["maturin==1.9.6"]'
          grep -Fq '"playwright": "1.62.1"' package.json
          grep -Fq '"packageManager": "bun@1.4.2"' package.json
          grep -Fq 'wasm-bindgen="=0.2.105"' crates/weft-wasm/Cargo.toml
          test -f Cargo.lock -a -f bun.lock -a -f rust-toolchain.toml
          cp .github/workflows/expected-host-source.sha256 "$PARITY_ROOT/expected-source.sha256"
          timeout --signal=TERM --kill-after=2s 30s sha256sum -c "$PARITY_ROOT/expected-source.sha256" > "$PARITY_ROOT/evidence/source-check.txt"
          {
            printf 'format\tweft.python-wasm-host-parity-receipt/1\n'
            printf 'needs_rust_sum_avg\t%s\n' '${{ needs.rust-sum-avg.result }}'
            printf 'event_name\t%s\nref\t%s\nsha\t%s\nworkflow\t%s\njob\t%s\nrun_id\t%s\nrun_attempt\t%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_WORKFLOW" "$GITHUB_JOB" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'runner_os\t%s\nrunner_arch\t%s\nimage_os\t%s\nimage_version\t%s\ncommit\t%s\ntree\t%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"
            printf 'monotonic_deadline_seconds\t%s\n' "$(cat "$PARITY_DEADLINE_FILE")"
          } > "$PARITY_ROOT/evidence/receipt.tsv"
          timeout --signal=TERM --kill-after=2s 30s bash -c 'sha256sum "$1" "$2"' _ .github/workflows/weft-sum-avg-qualification.yml "$PARITY_ROOT/expected-source.sha256" >> "$PARITY_ROOT/evidence/source-check.txt"
          cat > "$RUNNER_TEMP/weft-parity-tools/run-bounded" <<'RUNNER'
          #!/usr/bin/env bash
          set -uo pipefail
          name="$1"; stage_cap="$2"; shift 2
          root="$PARITY_ROOT/evidence"; global_deadline="$(cat "$PARITY_DEADLINE_FILE")"
          category="$RUNNER_TEMP/weft-parity-bootstrap-deadline"
          case "$name" in python-wheel-*|python-consumer-*|python-vectors|wheel-hash) category="$RUNNER_TEMP/weft-parity-wheel-deadline";; wasm-*|chromium-parity) category="$RUNNER_TEMP/weft-parity-wasm-deadline";; esac
          stage_deadline="$(cat "$category")"; now="$(awk '{print $1}' /proc/uptime)"
          remain=$(awk -v d="$global_deadline" -v n="$now" 'BEGIN {x=int(d-n-10); if(x<0)x=0; print x}')
          stage_remain=$(awk -v d="$stage_deadline" -v n="$now" 'BEGIN {x=int(d-n-10); if(x<0)x=0; print x}')
          (( stage_remain < remain )) && remain=$stage_remain
          limit="$stage_cap"; (( remain < limit )) && limit="$remain"
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; begin="$(awk '{print $1}' /proc/uptime)"; log="$root/logs/$name.log"
          if (( limit <= 0 )); then printf 'stage\t%s\tstart_utc=%s\tlimit_s=0\traw_exit=not-started\tgate_exit=124\n' "$name" "$started" >> "$root/commands.tsv"; exit 124; fi
          printf 'argv\t%s' "$name" >> "$root/commands.tsv"; printf '\t%q' "$@" >> "$root/commands.tsv"; printf '\n' >> "$root/commands.tsv"
          timeout --signal=TERM --kill-after=10s "${limit}s" "$@" > "$log" 2>&1
          raw=$?; ended="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; endmono="$(awk '{print $1}' /proc/uptime)"
          elapsed=$(awk -v a="$begin" -v b="$endmono" 'BEGIN {printf "%.2f", b-a}')
          original_bytes=$(wc -c < "$log"); truncated=no
          if (( original_bytes > 1048576 )); then tail -c 1048576 "$log" > "$log.tmp" && mv "$log.tmp" "$log"; truncated=yes; fi
          printf 'stage\t%s\tstart_utc=%s\tend_utc=%s\tduration_monotonic_s=%s\tlimit_s=%s\traw_exit=%s\tlog_original_bytes=%s\tlog_truncated=%s\tlog_sha256=%s\n' "$name" "$started" "$ended" "$elapsed" "$limit" "$raw" "$original_bytes" "$truncated" "$(sha256sum "$log" | cut -d' ' -f1)" >> "$root/commands.tsv"
          cat "$log"; exit "$raw"
          RUNNER
          chmod 700 "$RUNNER_TEMP/weft-parity-tools/run-bounded"
          cat > "$RUNNER_TEMP/weft-parity-tools/budget-gate" <<'GATE'
          #!/usr/bin/env bash
          set -euo pipefail
          out="$1"; stage="$2"; global="$(cat "$PARITY_DEADLINE_FILE")"; stage_deadline="$(cat "$stage")"
          now="$(awk '{print $1}' /proc/uptime)"
          minutes=$(awk -v g="$global" -v s="$stage_deadline" -v n="$now" 'BEGIN {x=g-n-10; y=s-n-10; if(y<x)x=y; print int(x/60)}')
          if (( minutes < 1 )); then echo "remaining budget is below one safely bounded minute" >&2; exit 124; fi
          printf 'timeout_minutes=%s\n' "$minutes" >> "$GITHUB_OUTPUT"
          printf 'started_monotonic=%s\n' "$now" >> "$GITHUB_OUTPUT"
          GATE
          chmod 700 "$RUNNER_TEMP/weft-parity-tools/budget-gate"
          timeout --signal=TERM --kill-after=2s 30s sha256sum "$PARITY_ROOT/expected-source.sha256" > "$PARITY_ROOT/evidence/expected-source-hash.txt"

      - name: Compute Python setup action budget
        id: python-budget
        shell: bash
        run: |
          "$RUNNER_TEMP/weft-parity-tools/budget-gate" "$GITHUB_OUTPUT" "$RUNNER_TEMP/weft-parity-bootstrap-deadline"
      - name: Set up Python 3.12
        id: setup-python
        timeout-minutes: ${{ steps.python-budget.outputs.timeout_minutes }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # reviewed immutable setup-python pin
        with:
          python-version: '3.12'
          check-latest: false

      - name: Record Python setup action timing
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          end=$(awk '{print $1}' /proc/uptime)
          start='${{ steps.python-budget.outputs.started_monotonic }}'
          if [ -n "$start" ]; then duration=$(awk -v a="$start" -v b="$end" 'BEGIN {printf "%.2f", b-a}'); else duration=not-started; fi
          printf 'action\tsetup-python@ece7cb06caefa5fff74198d8649806c4678c61a1\tstep_outcome=%s\tduration_monotonic_s=%s\ttimeout_minutes=%s\n' '${{ steps.setup-python.outcome }}' "$duration" '${{ steps.python-budget.outputs.timeout_minutes }}' >> "$PARITY_ROOT/evidence/commands.tsv"

      - name: Compute Bun setup action budget
        id: bun-budget
        shell: bash
        run: |
          "$RUNNER_TEMP/weft-parity-tools/budget-gate" "$GITHUB_OUTPUT" "$RUNNER_TEMP/weft-parity-bootstrap-deadline"
      - name: Set up Bun 1.4.2
        id: setup-bun
        timeout-minutes: ${{ steps.bun-budget.outputs.timeout_minutes }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # reviewed immutable setup-bun pin
        with:
          bun-version: '1.4.2'

      - name: Record Bun setup action timing
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          end=$(awk '{print $1}' /proc/uptime)
          start='${{ steps.bun-budget.outputs.started_monotonic }}'
          if [ -n "$start" ]; then duration=$(awk -v a="$start" -v b="$end" 'BEGIN {printf "%.2f", b-a}'); else duration=not-started; fi
          printf 'action\tsetup-bun@0c5077e51419868618aeaa5fe8019c62421857d6\tstep_outcome=%s\tduration_monotonic_s=%s\ttimeout_minutes=%s\n' '${{ steps.setup-bun.outcome }}' "$duration" '${{ steps.bun-budget.outputs.timeout_minutes }}' >> "$PARITY_ROOT/evidence/commands.tsv"

      - name: Acquire and assert toolchains, package lock, and Chromium (420-second shared budget)
        shell: bash
        run: |
          set -euo pipefail
          bounded="$RUNNER_TEMP/weft-parity-tools/run-bounded"
          "$bounded" bootstrap-rust 180 rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown --no-self-update
          "$bounded" bootstrap-python-tools 120 bash -c 'set -euo pipefail; python -m venv "$1"; "$1/bin/python" -m pip install --only-binary=:all: --no-deps --require-hashes "maturin @ https://files.pythonhosted.org/packages/58/1f/a2047ddf2230e700d5f8a13dd4b9af5ce806ad380c32e58105888205926e/maturin-1.9.6-py3-none-manylinux_2_12_x86_64.manylinux2010_x86_64.musllinux_1_1_x86_64.whl#sha256=0246202377c49449315305209f45c8ecef6e2d6bd27a04b5b6f1ab3e4ea47238"' _ "$RUNNER_TEMP/weft-parity-builder"
          "$bounded" bootstrap-wasm-bindgen 180 cargo install wasm-bindgen-cli --version 0.2.105 --locked --root "$RUNNER_TEMP/weft-parity-tools"
          "$bounded" bootstrap-bun-install 120 bun install --frozen-lockfile
          "$bounded" bootstrap-chromium 300 bunx --bun playwright@1.62.1 install --with-deps chromium
          "$bounded" verify-rust 60 bash -c 'set -euo pipefail; rustup run 1.90.0 rustc --version --verbose | tee "$1/evidence/rustc-version.txt"; rustup run 1.90.0 cargo --version --verbose | tee "$1/evidence/cargo-version.txt"; grep -q "release: 1.90.0" "$1/evidence/rustc-version.txt"; grep -q "cargo 1.90.0" "$1/evidence/cargo-version.txt"' _ "$PARITY_ROOT"
          "$bounded" verify-python 60 bash -c 'set -euo pipefail; "$1/bin/python" -c '\''import sys; print(sys.executable); print(sys.version); assert sys.version_info[:2] == (3,12)'\'' | tee "$2/evidence/python-version.txt"' _ "$RUNNER_TEMP/weft-parity-builder" "$PARITY_ROOT"
          "$bounded" verify-bun 60 bash -c 'set -euo pipefail; bun --version | tee "$1/evidence/bun-version.txt"; test "$(cat "$1/evidence/bun-version.txt")" = 1.4.2' _ "$PARITY_ROOT"
          "$bounded" verify-maturin 60 bash -c 'set -euo pipefail; "$1/bin/maturin" --version | tee "$2/evidence/maturin-version.txt"; grep -q "1.9.6" "$2/evidence/maturin-version.txt"' _ "$RUNNER_TEMP/weft-parity-builder" "$PARITY_ROOT"
          "$bounded" verify-wasm-bindgen 60 bash -c 'set -euo pipefail; "$1/bin/wasm-bindgen" --version | tee "$2/evidence/wasm-bindgen-version.txt"; grep -q "0.2.105" "$2/evidence/wasm-bindgen-version.txt"' _ "$RUNNER_TEMP/weft-parity-tools" "$PARITY_ROOT"
          "$bounded" verify-playwright 60 bun -e 'const p=require("playwright/package.json"),c=require("playwright-core/package.json");if(p.version!=="1.62.1"||c.version!=="1.62.1")process.exit(1);console.log(JSON.stringify({playwright:p.version,core:c.version}))' > "$PARITY_ROOT/evidence/playwright-version.json"
          "$bounded" hash-tools 60 bash -c 'set -euo pipefail; sha256sum "$(rustup which rustc --toolchain 1.90.0)" "$(rustup which cargo --toolchain 1.90.0)" "$1/bin/python" "$2/bin/maturin" "$3/bin/wasm-bindgen" "$(command -v bun)" > "$4/evidence/tool-hashes.sha256"' _ "$RUNNER_TEMP/weft-parity-builder" "$RUNNER_TEMP/weft-parity-builder" "$RUNNER_TEMP/weft-parity-tools" "$PARITY_ROOT"

      - name: Build wheel and run installed Python vectors (300-second shared budget)
        shell: bash
        run: |
          set -euo pipefail
          bounded="$RUNNER_TEMP/weft-parity-tools/run-bounded"
          mkdir -p "$PARITY_ROOT/wheels" "$PARITY_ROOT/consumer"
          "$bounded" python-wheel-build 240 bash -c 'cd crates/weft-python && "$1/bin/maturin" build --locked --profile dev --manifest-path Cargo.toml --out "$2"' _ "$RUNNER_TEMP/weft-parity-builder" "$PARITY_ROOT/wheels"
          mapfile -t wheels < <(find "$PARITY_ROOT/wheels" -maxdepth 1 -type f -name '*.whl' -print)
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          "$bounded" wheel-hash 30 sha256sum "$wheel" > "$PARITY_ROOT/evidence/wheel.sha256"
          "$bounded" python-consumer-venv 90 python -m venv "$PARITY_ROOT/consumer"
          "$bounded" python-wheel-install 120 "$PARITY_ROOT/consumer/bin/python" -m pip install --no-deps "$wheel"
          "$bounded" python-vectors 120 "$PARITY_ROOT/consumer/bin/python" tests/current-unity-aggregate/python-bridge.py --wheel "$wheel" --output "$PARITY_ROOT/evidence/parity.json"

      - name: Build WASM and run Chromium parity (360-second shared budget)
        shell: bash
        run: |
          set -euo pipefail
          bounded="$RUNNER_TEMP/weft-parity-tools/run-bounded"
          mkdir -p "$PARITY_ROOT/web"
          "$bounded" wasm-build 240 rustup run 1.90.0 cargo build --locked -p weft-wasm --manifest-path crates/weft-wasm/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features raw-postgresql-reads
          "$bounded" wasm-bindgen 90 "$RUNNER_TEMP/weft-parity-tools/bin/wasm-bindgen" target/wasm32-unknown-unknown/debug/weft_wasm.wasm --target web --out-dir "$PARITY_ROOT/web"
          "$bounded" wasm-hash 30 sha256sum "$PARITY_ROOT/web/weft_wasm.js" "$PARITY_ROOT/web/weft_wasm_bg.wasm" > "$PARITY_ROOT/evidence/wasm-hashes.sha256"
          "$bounded" chromium-parity 300 bun tests/current-unity-aggregate/browser-bridge.ts "$PARITY_ROOT/web" "$PARITY_ROOT/evidence/parity.json" "$PWD/node_modules/playwright/index.mjs" "$PARITY_ROOT/evidence/browser.json"

      - name: Always build fresh bounded public upload directory
        if: always()
        timeout-minutes: 1
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$PARITY_ROOT/evidence"
          upload="$RUNNER_TEMP/weft-host-parity-upload"
          mkdir -p "$evidence/logs"
          rm -rf "$upload"
          mkdir -p "$upload"
          if [ ! -f "$evidence/receipt.tsv" ]; then printf 'receipt_unavailable\tprior_failure_before_preflight\n' > "$evidence/receipt.tsv"; fi
          if [ ! -f "$evidence/commands.tsv" ]; then printf 'commands_unavailable\tno_commands_recorded\n' > "$evidence/commands.tsv"; fi
          : > "$evidence/limits.tsv"
          cap=1048576
          while IFS= read -r -d '' file; do
            size=$(wc -c < "$file")
            if (( size > cap )); then
              case "$file" in *parity.json|*browser.json)
                timeout --signal=TERM --kill-after=2s 30s sha256sum "$file" >> "$evidence/oversize-omissions.sha256"
                rm -f "$file"
                printf 'omitted_packet\t%s\toriginal_bytes=%s\treason=per_file_cap\n' "${file##*/}" "$size" >> "$evidence/limits.tsv"
                ;; *) tail -c "$cap" "$file" > "$file.bounded"; mv "$file.bounded" "$file"; printf 'truncated_file\t%s\toriginal_bytes=%s\tretained_bytes=%s\n' "${file##*/}" "$size" "$cap" >> "$evidence/limits.tsv";;
              esac
            fi
          done < <(find "$evidence" -type f -print0)
          cp -R "$evidence/." "$upload/"
          total=$(du -sb "$upload" | awk '{print $1}')
          if (( total > 8388608 )); then
            find "$upload/logs" -type f -print0 | sort -zr | while IFS= read -r -d '' file; do
              [ -f "$file" ] || continue
              size=$(wc -c < "$file")
              rm -f "$file"
              printf 'omitted_log\t%s\toriginal_bytes=%s\treason=aggregate_8MiB_cap\n' "${file##*/}" "$size" >> "$upload/limits.tsv"
              total=$(du -sb "$upload" | awk '{print $1}')
              (( total <= 8388608 )) && break
            done
          fi
          printf 'aggregate_upload_cap_bytes\t8388608\n' >> "$upload/limits.tsv"
          total=$(du -sb "$upload" | awk '{print $1}')
          if (( total > 8388608 )); then
            printf 'upload withheld: aggregate assembly is %s bytes (cap 8388608)\n' "$total"
            rm -rf "$upload"
            exit 1
          fi
          if [ -f "$upload/oversize-omissions.sha256" ]; then exit 1; fi
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"

      - name: Upload bounded public host-parity evidence
        if: always() && steps.evidence.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4.6.2
        with:
          name: weft-host-parity-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weft-host-parity-upload/
          if-no-files-found: error
          retention-days: 14
