name: Closed 0.4.57 Linux ARM64 product-R controller-A qualification
on:
  workflow_dispatch:
    inputs:
      prepare_pair:
        type: boolean
        default: false
      registration_sha:
        description: Reviewed main registration commit for this separate exact ARM64 R A pair
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: weft-0457-arm64-pair-c623b94b
  cancel-in-progress: false
jobs:
  arm64-pair:
    if: inputs.prepare_pair
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      REGISTRATION_SHA: ${{ inputs.registration_sha }}
      GH_TOKEN: ${{ github.token }}
      CARGO_BUILD_JOBS: '1'
    steps:
      - name: Start original ARM-only monotonic budget
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/arm-pair/evidence"
          printf '{"status":"incomplete","sourceCommit":"c623b94b66b0b46d492d457c62faddc896e2e452","workflowCommit":"%s"}\n' "$GITHUB_SHA" > "$RUNNER_TEMP/arm-pair/evidence/phase.json"
          echo "WEFT_RELEASE_DEADLINE_MONOTONIC=$(python3 -c 'import time;print(time.monotonic()+5400)')" >> "$GITHUB_ENV"
          echo "PAIR_OUT=$RUNNER_TEMP/arm-pair/evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v6
        timeout-minutes: 5
        with:
          ref: c623b94b66b0b46d492d457c62faddc896e2e452
          path: product
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          python-version: '3.11'
      - name: Admit separately registered ARM source and controller
        run: python controller/scripts/release/run_macos_pair_0457.py --phase preflight --target aarch64-unknown-linux-gnu --product-root "$GITHUB_WORKSPACE/product" --out "$PAIR_OUT" --registration-sha "$REGISTRATION_SHA"
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'
      - name: Bounded action acquisition image acquisition setup and cold build
        shell: bash
        run: |
          set -euo pipefail
          python controller/scripts/release/run_bounded_0454.py --stage arm-cold-acquisition-build --seconds 4200 --grace-seconds 30 --reserve-seconds 60 --log "$PAIR_OUT/arm-cold-acquisition-build.log" --receipt "$PAIR_OUT/arm-cold-acquisition-build-command.json" -- python controller/scripts/release/run_arm64_pair_0457.py --product-root "$GITHUB_WORKSPACE/product" --out "$PAIR_OUT"
      - name: Preserve actual product R wheel bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(find product/dist -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')" = 1
          cp product/dist/*.whl "$PAIR_OUT/"
          cp -R product/dist/current-native-tools "$PAIR_OUT/native-builder-tools"
      - name: Exact installed temporal routing SDK42 and source nonmutation
        run: |
          set -euo pipefail
          python controller/scripts/release/run_macos_pair_0457.py --phase sdk --target aarch64-unknown-linux-gnu --product-root "$GITHUB_WORKSPACE/product" --out "$PAIR_OUT"
          python controller/scripts/release/run_macos_pair_0457.py --phase finalize --target aarch64-unknown-linux-gnu --product-root "$GITHUB_WORKSPACE/product" --out "$PAIR_OUT"
      - name: Prepare original bounded artifact retention
        if: always()
        run: python controller/scripts/release/run_macos_pair_0457.py --phase retain --target aarch64-unknown-linux-gnu --product-root "$GITHUB_WORKSPACE/product" --out "$PAIR_OUT"
      - name: Retain exact pair qualification and partials
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ job.status == 'success' && format('weft-pair-aarch64-unknown-linux-gnu-c623b94b66b0b46d492d457c62faddc896e2e452-{0}-{1}-attempt-{2}', github.sha, github.run_id, github.run_attempt) || format('failed-weft-pair-arm64-{0}-{1}-attempt-{2}', github.sha, github.run_id, github.run_attempt) }}
          path: ${{ runner.temp }}/arm-pair/upload
          if-no-files-found: error
          retention-days: 90
