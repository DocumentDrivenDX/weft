name: Closed 0.4.57 public Linux consumer postflight
on:
  workflow_dispatch:
    inputs:
      verify_public:
        type: boolean
        default: false
      controller_sha:
        type: string
        required: true
      pypi_run_id:
        type: string
        required: true
      publication_attempt:
        type: string
        required: true
      release_id:
        type: string
        required: true
      release_manifest_sha256:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: weft-0457-public-postflight
  cancel-in-progress: false
jobs:
  public-postflight:
    if: inputs.verify_public
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROLLER_SHA: ${{ inputs.controller_sha }}
      PYPI_RUN_ID: ${{ inputs.pypi_run_id }}
      PUBLICATION_ATTEMPT: ${{ inputs.publication_attempt }}
      RELEASE_ID: ${{ inputs.release_id }}
      RELEASE_MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
    steps:
      - name: Retain initial incomplete operation identity
        run: |
          mkdir -p "$RUNNER_TEMP/public-postflight"
          printf '{"status":"incomplete","actualController":"%s","run":"%s","attempt":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/public-postflight/initial.json"
      - uses: actions/checkout@v6
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        timeout-minutes: 3
        with:
          python-version: '3.11'
      - name: Test closed public evidence refusal controls
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/release -p test_public_postflight_0457.py -v 2>&1 | tee "$RUNNER_TEMP/public-postflight/pure-controls.log"
      - name: One independent public-index-only consumer
        run: |
          set -euo pipefail
          python scripts/release/verify_public_postflight_0457.py \
            --controller-sha "$CONTROLLER_SHA" --pypi-run "$PYPI_RUN_ID" \
            --publication-attempt "$PUBLICATION_ATTEMPT" --release-id "$RELEASE_ID" \
            --release-manifest-sha256 "$RELEASE_MANIFEST_SHA256" \
            --out "$RUNNER_TEMP/public-postflight/proof" 2>&1 | tee "$RUNNER_TEMP/public-postflight/operation.log"
      - name: Retain original public postflight evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: weft-public-postflight-0457-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-postflight/
          if-no-files-found: error
          retention-days: 365
