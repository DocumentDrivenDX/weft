[workspace]
members = ["crates/weft-databricks","crates/weft-postgresql","crates/weft-runtime","crates/weft-python","crates/weft-wasm","tests/register-backend/probe","tests/frontend/wasm-probe","crates/weft-core", "spikes/b001/core", "spikes/b001/python", "spikes/b001/wasm"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision", "raw_value"] }
sha2 = "=0.10.9"
sqlparser = { version = "=0.63.0", default-features = false, features = ["std"] }

[patch.crates-io]
ahash = { path = "vendor/ahash" }

# Preserve native extension loadability on macOS27 with the pinned Rust toolchain.
# rust-lang/rust#157750: stripping debuginfo can misalign the Mach-O string pool.
# Optimization stays at the normal release level; only final-crate line tables stay.
[profile.release.package.weft-python]
debug = 1
strip = "none"
