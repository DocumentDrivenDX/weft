[workspace]
members = ["crates/weft-databricks","crates/weft-postgresql","crates/weft-runtime","crates/weft-python","crates/weft-wasm","tests/register-backend/probe","tests/frontend/wasm-probe","crates/weft-core"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision", "raw_value"] }
sha2 = "=0.10.9"
sqlparser = { version = "=0.63.0", default-features = false, features = ["std", "visitor"] }

[patch.crates-io]
hashbrown-012 = { package = "hashbrown", version = "=0.12.3", git = "https://github.com/DocumentDrivenDX/umf.git", rev = "e3f38ef6f05ae636d2837f9d69f8d6805222664b" }
hashbrown-013 = { package = "hashbrown", version = "=0.13.2", git = "https://github.com/DocumentDrivenDX/umf.git", rev = "e3f38ef6f05ae636d2837f9d69f8d6805222664b" }
json-ld-core = { package = "json-ld-core", version = "=0.21.4", git = "https://github.com/DocumentDrivenDX/umf.git", rev = "e3f38ef6f05ae636d2837f9d69f8d6805222664b" }
json-ld-syntax = { package = "json-ld-syntax", version = "=0.21.4", git = "https://github.com/DocumentDrivenDX/umf.git", rev = "e3f38ef6f05ae636d2837f9d69f8d6805222664b" }
json-syntax = { package = "json-syntax", version = "=0.12.5", git = "https://github.com/DocumentDrivenDX/umf.git", rev = "e3f38ef6f05ae636d2837f9d69f8d6805222664b" }
xsd-types = { package = "xsd-types", version = "=0.9.6", git = "https://github.com/DocumentDrivenDX/umf.git", rev = "e3f38ef6f05ae636d2837f9d69f8d6805222664b" }
ahash = { path = "vendor/ahash" }

# Preserve native extension loadability on macOS27 with the pinned Rust toolchain.
# rust-lang/rust#157750: stripping debuginfo can misalign the Mach-O string pool.
# Optimization stays at the normal release level; only final-crate line tables stay.
[profile.release.package.weft-python]
debug = 1
strip = "none"
